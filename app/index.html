<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f2a24">
<title>PfeilZaehler3000</title>
<style>
:root{
  --bg:#f5f3ee;--card:#fffdf8;--ink:#1d211e;--muted:#6b716c;--line:#e2ded4;
  --accent:#2f6b4f;--accent-soft:#dcebe2;--warn:#b5542a;--warn-soft:#f6e1d6;--bar:#2f6b4f;
  --red:#c0392b;--red-soft:#f8e0dc;--amber:#b7791f;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141715;--card:#1c201d;--ink:#e9ece8;--muted:#9aa29c;--line:#2c322e;
  --accent:#7cc39c;--accent-soft:#1f3a2c;--warn:#e89a72;--warn-soft:#3b2519;--bar:#7cc39c;
  --red:#ef7a6c;--red-soft:#3d1f1b;--amber:#e3b25a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px;font-weight:600}
.sub{color:var(--muted);font-size:14px}
button,select,input{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.btn{background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.big{width:100%;padding:14px 16px;font-size:17px}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.btns .btn{width:100%;min-height:44px}
.btns[hidden]{display:none}
.btns.three{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.btns .btn{line-height:1.2}
.btns.two{grid-template-columns:repeat(2,1fr)}
.btns.three .btn{padding:10px 6px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;flex:none}
.icon-btn.del{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}
.icon-btn.undo{color:var(--accent)}
.icon-btn svg.i{width:20px;height:20px}
.endbox .btn{min-height:44px;min-width:120px}
.group{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:10}
.overlay[hidden]{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;max-height:92vh}
.panel textarea{width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}
.endbox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.endn{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.endof{color:var(--muted);font-size:18px;margin-left:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{color:var(--accent)}
.chip.wait{color:var(--amber)}
.chip.bad{color:var(--red)}
.chip.off{color:var(--muted)}
.chip .k{color:var(--muted);font-size:12px}
.msg{margin-top:6px;color:var(--muted)}
.msg:empty{display:none}
.msg b{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .n{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px 6px;margin-top:10px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:10px}
.sess{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.sess .top{display:flex;justify-content:space-between;gap:8px}
.sess .big{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.ends{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.end{min-width:32px;text-align:center;padding:2px 6px;border-radius:6px;background:var(--accent-soft);font-size:13px;font-variant-numeric:tabular-nums}
.end.off{background:var(--warn-soft);color:var(--warn);font-weight:600}
button.end{border:0;font:inherit;color:inherit;cursor:pointer;min-height:32px}
.avg{font-size:13px;color:var(--muted);margin-top:8px}
.arrows{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.arow{border:1px solid var(--line);border-radius:10px;font-variant-numeric:tabular-nums}
.arow.gone .line{opacity:.45;text-decoration:line-through}
.arow .line{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 10px}
.arow .no{color:var(--muted);width:22px}
.arow .tm{flex:1;cursor:pointer;display:flex;align-items:center;gap:6px}
.arow .tm .chev{color:var(--muted);transition:transform .15s}
.arow.open .tm .chev{transform:rotate(90deg)}
.arow .det{display:none;grid-template-columns:1fr 1fr;gap:4px 12px;padding:0 10px 10px 42px;font-size:13px}
.arow.open .det{display:grid}
.det .k{color:var(--muted)}
.det .full{grid-column:1/-1}
.small{font-size:13px;color:var(--muted)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:600}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
label.stack{flex-wrap:wrap}
label select{max-width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
label input{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.hint{font-size:12px;color:var(--muted);margin:-2px 0 6px}
.empty{color:var(--muted);padding:12px 0}
.demo{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:8px 12px;margin:10px 0 0;font-size:14px}
.demo a,.small a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bt" viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></symbol>
  <symbol id="i-mem" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</svg>
<main>
  <h1>PfeilZaehler3000</h1>
  <div class="demo" id="demo" data-i18n-html="exampleBanner" hidden></div>
  <div class="sub" data-i18n="sub"></div>

  <div class="status">
    <div class="chips" id="chips"></div>
    <div class="msg" id="status"></div>
  </div>
  <button class="btn big" id="connect"></button>
  <div class="btns two" id="podbtns" hidden>
    <button class="btn ghost" id="choose" data-i18n="choosePod" hidden></button>
    <button class="btn ghost" id="disconnect" data-i18n="disconnect" hidden></button>

  <h2 data-i18n="thisEnd"></h2>

  <details>

    <label><span data-i18n="sArrows"></span> <input type="number" id="s-arrows" min="1" max="24"></label>

    <div class="group" data-i18n="grpMount"></div>
    <label class="stack"><span data-i18n="sMount"></span> <select id="s-mount"><option value="0" data-i18n="mount0"></option><option value="1" data-i18n="mount1"></option><option value="2" data-i18n="mount2"></option></select></label>

  <div class="group" data-i18n="grpExport"></div>
  <div class="btns three">
    <button class="btn ghost" id="csv" data-i18n="csv"></button>

  <input type="file" id="file" accept=".json" hidden>
  <div class="group" data-i18n="grpReset"></div>
  <div class="btns two">
    <button class="btn ghost danger" id="resetday" data-i18n="resetToday"></button>
    <button class="btn ghost danger" id="reset" data-i18n="resetAll"></button>
  </div>
  <p class="small" data-i18n-html="footer"></p>
</main>

<div class="overlay" id="box" hidden>
  <div class="panel">
    <div class="row" style="justify-content:space-between"><b id="box-title">Export</b><button class="btn ghost" id="box-close" data-i18n="close"></button></div>
    <p class="small" id="box-hint"></p>

    <div class="row">
      <button class="btn" id="box-copy" data-i18n="copy"></button>
      <button class="btn" id="box-restore" data-i18n="restore" hidden></button>
      <button class="btn ghost" id="box-file" data-i18n="chooseFile"></button>

</div>

<div class="overlay" id="cal" hidden>
  <div class="panel">
    <b data-i18n="calTitle"></b>

      <button class="btn ghost" id="sheet-done" data-i18n="done"></button>
    </div>

<script>
// ---------- demo mode (page opened with ?demo) ----------
// Example history and an example pod: everything works, nothing is saved, no Bluetooth is used.
if (new URLSearchParams(location.search).has('demo')) (() => {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const between = (a, b) => a + (b - a) * rnd();
  const now = Math.floor(Date.now() / 1000);
  const day0 = new Date(); day0.setHours(0, 0, 0, 0);
  const detail = () => ({
    raise: +between(0.9, 1.7).toFixed(1), draw: +between(1.7, 2.9).toFixed(1), hold: +between(1.1, 2.7).toFixed(1),
    move: +between(0.05, 0.21).toFixed(2), pitch: Math.round(between(2, 8)) / 2, cant: Math.round(between(-2, 4)) / 2,
    drop: Math.round(between(10, 26)), side: Math.round(between(-4, 4)) });
  // one session: ends of 6 (now and then 5 or 7), ~35 s between arrows, ~3 min between ends
  function session(start, ends, list) {
    let t = start;
    for (let e = 0; e < ends; e++) {
      const n = rnd() < 0.08 ? 5 : rnd() < 0.06 ? 7 : 6;
      for (let k = 0; k < n; k++) { list.push({ t, peak: +between(32, 58).toFixed(1), aim: +between(4, 7).toFixed(1), flags: 1, d: detail() }); t += Math.round(between(26, 46)); }
      t += Math.round(between(140, 230));
    }
    return t;
  }
  // past 6 weeks: 3–4 sessions a week, in the evening
  const past = [];
  for (let d = 42; d >= 1; d--) {
    if (rnd() < 0.45) continue;
    const start = Math.floor(day0.getTime() / 1000) - d * 86400 + Math.round(between(16.5, 18.5) * 3600);
    session(start, Math.round(between(6, 14)), past);
  }
  past.forEach((x, i) => { x.i = i; });
  // today: 3 complete ends and 4 arrows of the 4th, still on the pod (not synced yet)
  const today = [];
  session(now - 15 * 60, 3, today);
  const t4 = today[today.length - 1].t + 200;
  for (let k = 0, tk = t4; k < 4; k++, tk += Math.round(between(27, 44))) today.push({ t: tk, peak: +between(32, 58).toFixed(1), aim: +between(4, 7).toFixed(1), flags: 1, d: detail() });
  const shift = now - 40 - today[today.length - 1].t;         // last arrow 40 s ago
  today.forEach(x => { x.t += shift; });
  const pod = today.map((x, k) => Object.assign(x, { i: past.length + k }));
  const base = past.length;
  let settings = [0x5E, 6, 100, 0, 1, 2, 0, 0];               // 6 arrows, 100 s, calibrated, back of the riser

  const listeners = {}, notifyOn = {};
  const dv = a => new DataView(Uint8Array.from(a).buffer);
  const u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  const u16 = v => [v & 255, (v >> 8) & 255];
  const emit = (n, bytes) => { if (notifyOn[n]) setTimeout(() => (listeners[n] || []).forEach(f => f({ target: { value: dv(bytes) } })), 30); };
  const live = () => pod.filter(r => !(r.flags & 0xC0));
  const info = () => [...u32(base + pod.length), ...u32(base), ...u16(3940), 4, 1, 17, 0, 0, 0, 0, 0, 0, 0];
  const stats = () => { const n = live().length, l = live(); return [...u32(base + n), ...u16(n), ...u16(n + 61), ...u16(n + 340), ...u16(3940), ...u32(0), ...u32(l.length ? l[l.length - 1].t : 0)]; };
  const detBytes = d => d ? [Math.round(d.raise * 10), Math.round(d.draw * 10), Math.round(d.hold * 10), Math.round(d.move * 100), Math.round(d.pitch * 2) & 255, Math.round(d.cant * 2) & 255, d.drop & 255, d.side & 255] : [0, 0, 0, 0, 0, 0, 0, 0];
  function ch(n) {
    return {
      async readValue() { return dv(n === 2 ? info() : n === 5 ? stats() : n === 6 ? settings : [0]); },
      async writeValue(buf) {
        const b = [...new Uint8Array(buf.buffer || buf)];
        const v = (b[1] | b[2] << 8 | b[3] << 16 | b[4] << 24) >>> 0;
        if (n === 3 && b[0] === 1) {                          // dump records + details
          setTimeout(() => {
            for (let i = Math.max(v, base); i < base + pod.length; i += 2) {
              const pk = [...u32(i)], dp = [...u32(i)];
              for (let k = i; k < Math.min(i + 2, base + pod.length); k++) {
                const r = pod[k - base];
                pk.push(...u32(r.t), ...u16(Math.round(r.peak * 10)), Math.round(r.aim * 10), r.flags);
                dp.push(...detBytes(r.flags & 0x40 ? null : r.d));
              }
              (listeners[4] || []).forEach(f => f({ target: { value: dv(pk) } }));
              (listeners[7] || []).forEach(f => f({ target: { value: dv(dp) } }));
            }
            (listeners[4] || []).forEach(f => f({ target: { value: dv([255, 255, 255, 255, ...u32(base + pod.length)]) } }));
          }, 150);
        } else if (n === 3 && b[0] === 4) {                   // delete / restore
          const cnt = b[5] | b[6] << 8;
          for (let i = v; i < v + cnt; i++) { const r = pod[i - base]; if (r) r.flags = b[7] ? r.flags | 0x80 : r.flags & ~0x80; }
          emit(5, stats()); emit(2, info());
        } else if (n === 3 && b[0] === 7) {                   // end mark
          pod.push({ i: base + pod.length, t: v, peak: 0, aim: 0, flags: 0x41 }); emit(5, stats()); emit(2, info());
        } else if (n === 3 && b[0] === 9) { settings[4] = (settings[4] & 0x0C) | 1; settings[5] = 1; emit(6, settings); }
        else if (n === 3 && b[0] === 10) { settings[5] = 2; emit(6, settings); }
        else if (n === 6) { const f = b.length >= 4 ? (settings[4] & ~0x0C) | ((b[3] & 3) << 2) : settings[4]; settings = [0x5E, b[0], b[1], b[2], f, settings[5], 0, 0]; emit(6, settings); }
      },
      async startNotifications() { notifyOn[n] = true; },
      addEventListener(ev, f) { (listeners[n] = listeners[n] || []).push(f); },
    };
  }
  let timer = null;
  const dev = { id: 'demo', name: 'PfeilZaehler3000-A3F2', addEventListener() {},
    gatt: { connected: false,
      async connect() {
        await new Promise(r => setTimeout(r, 400));
        this.connected = true;
        if (!timer) timer = setInterval(() => {                // a new arrow every 30 s while connected
          if (!dev.gatt.connected) return;
          const last = live().length ? live()[live().length - 1].t : now;
          const t = Math.max(Math.floor(Date.now() / 1000), last + 1);
          pod.push({ i: base + pod.length, t, peak: +between(32, 58).toFixed(1), aim: +between(4, 7).toFixed(1), flags: 1, d: detail() });
          emit(2, info()); emit(5, stats());
        }, 30000);
        return { async getPrimaryService() { return { async getCharacteristic(u) { return ch(+u[7]); } }; } };
      },
      disconnect() { this.connected = false; } } };
  window.__pzDemo = {
    db: () => ({ shots: past, nextIndex: base, endMarks: [], ops: [], lastSync: Date.now() - 2 * 86400000, podName: dev.name,
                 settings: { arrows: 6, endGap: 100, sessGap: 45, clearAt: 50, dist: 18 } }),
    bluetooth: { async requestDevice() { return dev; } },
  };
})();
</script>
<script>
// ---------- languages: English, Deutsch, Polski ----------
// Plural entries are arrays: [one, other] in English and German, [one, few, many] in Polish.
const I18N = {
en: {

const UUID_TIME = U(1), UUID_INFO = U(2), UUID_CTRL = U(3), UUID_DATA = U(4), UUID_STATS = U(5),
      UUID_SETTINGS = U(6), UUID_DETAIL = U(7);
const F_END = 0x40, F_DEL = 0x80;          // record flags: end mark, deleted
const icon = (id, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

// ---------- storage ----------
const KEY = 'pfeilzaehler3000.v1';
const OLD_KEY = 'arrowlog.v1';                     // data saved before the rename is taken over once
const DEMO = !!window.__pzDemo;                    // ?demo: example data, example pod, nothing saved
const BT = DEMO ? window.__pzDemo.bluetooth : navigator.bluetooth;   // Web Bluetooth, or the example pod
if (DEMO) document.getElementById('demo').hidden = false;
function load() {
  if (DEMO) return window.__pzDemo.db();
  for (const k of [KEY, OLD_KEY]) {
    try { const d = JSON.parse(localStorage.getItem(k)); if (d && d.shots) return d; } catch (e) {}
  }
  return { shots: [], nextIndex: 0, endMarks: [], settings: { arrows: 6, endGap: 100, sessGap: 45, clearAt: 50, dist: 18 } };
}
let db = load();
if (!Array.isArray(db.endMarks)) db.endMarks = [];
if (!Array.isArray(db.ops)) db.ops = [];        // changes waiting to be sent to the pod (deletes, end marks, settings)
if (!db.settings.dist) db.settings.dist = 18;
const live = () => db.shots.filter(x => !(x.flags & F_DEL));
// history of "arrows per end" / "new end after pause": each end is judged with the values valid at that time
if (!Array.isArray(db.hist) || !db.hist.length) db.hist = [{ from: 0, arrows: db.settings.arrows, endGap: db.settings.endGap }];
function setAt(t) { let r = db.hist[0]; for (const h of db.hist) if (h.from <= t) r = h; return r; }
function save() { if (DEMO) return; try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { setStatus(t('saveFail')); } }

// ---------- analysis (exposed for testing) ----------
function groupSessions(shots, s, marks = [], at = null) {
  const dated = shots.filter(x => x.t > 1600000000).sort((a, b) => a.t - b.t);
  const sessions = [];
  let cur = null, end = null, prev = null;
  for (const x of dated) {
    if (!cur || x.t - prev > s.sessGap * 60) {
      cur = { start: x.t, stop: x.t, ends: [], shots: 0 }; sessions.push(cur); end = null;
    }
    const marked = prev !== null && marks.some(m => m > prev && m <= x.t);   // "New end" pressed in between
    const cfg = at ? at(x.t) : s;
    if (!end || x.t - prev > cfg.endGap || marked) { end = { start: x.t, n: 0, arrows: cfg.arrows, list: [] }; cur.ends.push(end); }
    end.n++; end.list.push(x); cur.shots++; cur.stop = x.t; prev = x.t;
  }
  return sessions;
}
function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function weekStart(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function totals(shots, now = new Date()) {
  const today = dayKey(now), wk = weekStart(now).getTime(), mo = monthKey(now);
  let t = 0, w = 0, m = 0;
  for (const x of shots) {
    if (x.t < 1600000000) continue;
    const d = new Date(x.t * 1000);
    if (dayKey(d) === today) t++;
    if (weekStart(d).getTime() === wk) w++;
    if (monthKey(d) === mo) m++;
  }
  return { today: t, week: w, month: m, all: shots.length };
}
function buckets(shots, mode, now = new Date()) {
  const out = [];
  if (mode === 'day') {
    for (let i = 29; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i); out.push({ key: dayKey(d), label: i % 7 === 0 ? d.getDate() + '.' + (d.getMonth() + 1) + '.' : '', n: 0 }); }
    const idx = Object.fromEntries(out.map((b, i) => [b.key, i]));
    for (const x of shots) { const k = dayKey(new Date(x.t * 1000)); if (k in idx) out[idx[k]].n++; }
  } else if (mode === 'week') {
    const w0 = weekStart(now);
    for (let i = 11; i >= 0; i--) { const d = new Date(w0); d.setDate(d.getDate() - 7 * i); out.push({ key: d.getTime(), label: i % 2 === 0 ? d.getDate() + '.' + (d.getMonth() + 1) + '.' : '', n: 0 }); }
    const idx = Object.fromEntries(out.map((b, i) => [b.key, i]));
    for (const x of shots) { const k = weekStart(new Date(x.t * 1000)).getTime(); if (k in idx) out[idx[k]].n++; }
  } else {
    const names = t('monthNames');
    for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); out.push({ key: monthKey(d), label: names[d.getMonth()], n: 0 }); }
    const idx = Object.fromEntries(out.map((b, i) => [b.key, i]));
    for (const x of shots) { const k = monthKey(new Date(x.t * 1000)); if (k in idx) out[idx[k]].n++; }
  }
  return out;
}

// shot details from the pod (firmware 2.0+): times in s, angles in degrees; null = not measured
function parseDetailBytes(dv, o) {
  const u = k => dv.getUint8(o + k), s = k => dv.getInt8(o + k);
  let any = false;
  for (let k = 0; k < 8; k++) if (u(k)) any = true;
  if (!any) return null;
  const tm = v => v ? v / 10 : null;
  return { raise: tm(u(0)), draw: tm(u(1)), hold: tm(u(2)), move: u(3) ? u(3) / 100 : null,
           pitch: s(4) === -128 ? null : s(4) / 2, cant: s(5) === -128 ? null : s(5) / 2,      // -128: side mount, not measured
           drop: s(6) === -128 ? null : s(6), side: s(7) === -128 ? null : s(7) };
}
function parseDetail(dv) {
  const first = dv.getUint32(0, true), out = [];
  for (let o = 4, i = 0; o + 8 <= dv.byteLength; o += 8, i++) out.push({ i: first + i, d: parseDetailBytes(dv, o) });
  return out;
}
// averages of a list of arrows: hold, aim movement, cant spread, raise
function summary(list) {
  const d = list.map(x => x.d).filter(Boolean);
  if (!d.length) return null;
  const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
  const pick = k => d.map(x => x[k]).filter(v => v !== null && v !== undefined);
  const cants = pick('cant'), cm = mean(cants);
  const sd = cants.length > 1 ? Math.sqrt(mean(cants.map(v => (v - cm) ** 2))) : null;
  return { n: d.length, hold: mean(pick('hold')), move: mean(pick('move')), raise: mean(pick('raise')), draw: mean(pick('draw')), cantSd: sd, cant: cm };
}

// ---------- formatting ----------
let chartMode = 'day';
const $ = id => document.getElementById(id);
function setStatus(html) { $('status').innerHTML = html; }
function fmtTime(ts) { return new Date(ts * 1000).toLocaleTimeString(LOC, { hour: '2-digit', minute: '2-digit' }); }
function fmtDate(ts) { return new Date(ts * 1000).toLocaleDateString(LOC, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }
function fmtSplit(sec) { sec = Math.max(0, Math.round(sec)); return '+' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
const f1 = v => v === null || v === undefined ? '–' : v.toFixed(1);
function cm(deg) { return Math.tan(deg * Math.PI / 180) * db.settings.dist * 100; }
function fmtMove(deg) { return deg === null || deg === undefined ? '–' : `${deg.toFixed(2)}° ≈ ${cm(deg).toFixed(1)} cm`; }
function fmtCant(c) { if (c === null || c === undefined) return '–'; if (Math.abs(c) < 0.25) return '0°'; return `${Math.abs(c).toFixed(1)}° ${c > 0 ? t('right') : t('left')}`; }
function fmtFollow(d) {
  const a = [];
  if (d.drop === null) return '–';
  a.push(d.drop >= 0 ? `${d.drop}° ${t('down')}` : `${-d.drop}° ${t('up')}`);
  if (d.side) a.push(`${Math.abs(d.side)}° ${d.side > 0 ? t('right') : t('left')}`);
  return a.join(', ');
}

// ---------- rendering ----------
function renderChart() {
  const b = buckets(live(), chartMode);
  const W = 340, H = 150, pad = 18, top = 16;
  const max = Math.max(6, ...b.map(x => x.n));
  const bw = (W - 8) / b.length;
  let s = `<svg viewBox="0 0 ${W} ${H + pad}" role="img" aria-label="${t('chartAria')}">`;
  s += `<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>`;
  b.forEach((x, i) => {
    const h = x.n ? Math.max(2, (x.n / max) * (H - top)) : 0;
    const X = 4 + i * bw + bw * 0.15, w = bw * 0.7;
    if (h) s += `<rect x="${X}" y="${H - h}" width="${w}" height="${h}" rx="2" fill="var(--bar)"><title>${t('arrows', { n: x.n })}</title></rect>`;
    if (x.n && (b.length <= 12 || x.n === max)) s += `<text x="${X + w / 2}" y="${H - h - 3}" text-anchor="middle">${x.n}</text>`;
    if (x.label) s += `<text x="${X + w / 2}" y="${H + 13}" text-anchor="middle">${x.label}</text>`;
  });
  $('chart').innerHTML = s + '</svg>';
}

function avgLine(sm) {
  if (!sm) return '';
  const p = [];
  if (sm.hold !== null) p.push(t('avgHold', { v: f1(sm.hold) }));
  if (sm.move !== null) p.push(t('avgMove', { d: sm.move.toFixed(2), c: cm(sm.move).toFixed(1) }));
  if (sm.cantSd !== null) p.push(t('avgCant', { v: sm.cantSd.toFixed(1) }));
  return p.length ? t('avg') + p.join(' · ') : '';
}

let shownSessions = [];
function renderSessions() {
  const s = db.settings;
  const sess = groupSessions(live(), s, db.endMarks, setAt).reverse().slice(0, 40);
  shownSessions = sess;
  const undated = live().filter(x => x.t <= 1600000000).length;
  if (!sess.length && !undated) { $('sessions').innerHTML = `<div class="empty">${t('noArrows')}</div>`; return; }
  let h = '';
  for (const [si, x] of sess.entries()) {
    const off = x.ends.filter(e => e.n !== e.arrows).length;
    const all = x.ends.flatMap(e => e.list);
    const av = avgLine(summary(all));
    h += `<div class="sess"><div class="top"><div><div>${fmtDate(x.start)}</div><div class="small">${fmtTime(x.start)}–${fmtTime(x.stop)} · ${t('ends', { n: x.ends.length })}${off ? ` · ${t('offN', { n: off })}` : ''}</div></div><div class="big">${x.shots}</div></div><div class="ends">`;
    x.ends.forEach((e, ei) => { h += `<button class="end${e.n !== e.arrows ? ' off' : ''}" data-s="${si}" data-e="${ei}" aria-label="${t('endAria', { e: ei + 1, n: e.n, a: e.arrows })}">${e.n}</button>`; });
    h += '</div>' + (av ? `<div class="avg">${av}</div>` : '') + '</div>';
  }
  if (undated) h += `<div class="small">${t('undated', { n: undated })}</div>`;
  $('sessions').innerHTML = h;
}

// arrows in the end that is still open: last end, if its last arrow is recent and "New end" wasn't pressed since
function currentEnd(nowSec = Date.now() / 1000) {
  const sess = groupSessions(live(), db.settings, db.endMarks, setAt);
  if (!sess.length) return 0;
  const last = sess[sess.length - 1], end = last.ends[last.ends.length - 1];
  if (nowSec - last.stop > setAt(nowSec).endGap) return 0;
  if (db.endMarks.some(m => m > last.stop)) return 0;
  return end.n;
}

function render() {
  const e = currentEnd();
  $('t-end').textContent = e;
  $('t-endof').textContent = '/ ' + db.settings.arrows;
  $('t-end').style.color = e === db.settings.arrows ? 'var(--accent)' : (e > db.settings.arrows ? 'var(--warn)' : '');
  const tot = totals(live());
  $('t-today').textContent = tot.today; $('t-week').textContent = tot.week;
  $('t-month').textContent = tot.month; $('t-all').textContent = tot.all;
  renderChart(); renderSessions(); renderChips(); renderCantState();
}

// ---------- status line: connection, battery, pod memory, last sync ----------
let conn = 'off';                                  // off | wait | ok | lost
function battIcon(mv) {
  const f = Math.max(0, Math.min(1, (mv - 3500) / (4150 - 3500)));
  return `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2"/>` +
    `<rect x="4" y="9" width="${(13 * f).toFixed(1)}" height="6" rx="1" fill="currentColor" stroke="none"/></svg>`;
}
function renderChips() {
  const name = (dev && dev.name) || db.podName || '';
  const short = name.replace('PfeilZaehler3000-', 'Pod ') || 'Pod';
  const cText = { off: dev || db.podName ? t('chipNotConn', { pod: short }) : t('notConnected'), wait: t('chipConnecting', { pod: short }), ok: short, lost: t('chipReconnecting', { pod: short }) }[conn];
  const cCls = { off: 'off', wait: 'wait', ok: 'ok', lost: 'bad' }[conn];
  let h = `<span class="chip ${cCls}" title="${t('tipBt')}">${icon('bt')}${cText}</span>`;
  if (info) {
    const v = info.mv / 1000, bc = !info.mv ? 'off' : v < 3.6 ? 'bad' : v < 3.7 ? 'wait' : '';
    h += `<span class="chip ${bc}" title="${t('tipBatt', { t: fmtClock(info.at) })}">${battIcon(info.mv)}${info.mv ? v.toFixed(2) + ' V' : '–'}</span>`;
    h += `<span class="chip${info.storage >= 80 ? ' bad' : ''}" title="${t('tipMem', { p: db.settings.clearAt })}">${icon('mem')}${info.storage} %</span>`;
  }
  if (db.lastSync) h += `<span class="chip" title="${t('tipSync')}">${icon('sync')}${fmtClock(db.lastSync)}</span>`;
  $('chips').innerHTML = h;
}
function fmtClock(ms) {
  const d = new Date(ms), today = dayKey(new Date()) === dayKey(d);
  return today ? d.toLocaleTimeString(LOC, { hour: '2-digit', minute: '2-digit' })
               : d.toLocaleDateString(LOC, { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString(LOC, { hour: '2-digit', minute: '2-digit' });
}

// ---------- Bluetooth ----------
let dev = null, chars = {}, info = null, dumpResolve = null, incoming = [], incomingDetails = new Map();

function parseInfo(dv) {
  return { total: dv.getUint32(0, true), base: dv.getUint32(4, true), mv: dv.getUint16(8, true),
           storage: dv.getUint8(10), at: Date.now(), exact: !!(dv.getUint8(11) & 1), fw: dv.getUint8(12) };
}
function parseData(dv) {
  const first = dv.getUint32(0, true);
  if (first === 0xFFFFFFFF) return { end: true, total: dv.getUint32(4, true) };
  const recs = [];
  for (let o = 4, i = 0; o + 8 <= dv.byteLength; o += 8, i++)
    recs.push({ i: first + i, t: dv.getUint32(o, true), peak: dv.getUint16(o + 4, true) / 10, aim: dv.getUint8(o + 6) / 10, flags: dv.getUint8(o + 7) });
  return { recs };
}
function parseSettings(dv) {
  return { arrows: dv.getUint8(1), endGap: dv.getUint16(2, true), flags: dv.getUint8(4), cal: dv.getUint8(5), cantRef: dv.getInt16(6, true) / 10 };
}

function showInfo() { renderChips(); }

let userDisconnect = false, retryTimer = null, retryUntil = 0;
function updateButtons() {
  const connected = !!(dev && dev.gatt.connected);
  if (!connected && conn === 'ok') conn = 'off';
  $('connect').textContent = dev ? (connected ? t('updateNow') : t('reconnect')) : t('connect');
  $('disconnect').hidden = !connected;
  $('choose').hidden = !dev;
  $('podbtns').hidden = !dev;
  $('setlevel').disabled = !connected || !chars.settings;
  renderChips();
}
// keep trying to reconnect for a while (pod out of range, phone screen was off, ...)
function scheduleReconnect(seconds = 60) {
  retryUntil = Date.now() + seconds * 1000;
  if (retryTimer) return;
  const tryOnce = async () => {
    retryTimer = null;
    if (!dev || dev.gatt.connected || userDisconnect || document.hidden || Date.now() > retryUntil) { if (!dev || !dev.gatt.connected) conn = 'off'; updateButtons(); return; }
    try { await attach(dev); }
    catch (e) { conn = 'lost'; setStatus(t('retrying')); renderChips(); retryTimer = setTimeout(tryOnce, 5000); }
  };
  retryTimer = setTimeout(tryOnce, 1000);
}
let knownDevice = null;
async function attach(device) {
  dev = device;
  if (knownDevice !== device) {                    // add the disconnect handler only once per device
    knownDevice = device;
    dev.addEventListener('gattserverdisconnected', () => {
      if (userDisconnect) { conn = 'off'; setStatus(''); updateButtons(); return; }
      conn = 'lost'; setStatus('');
      updateButtons();
      scheduleReconnect(60);
    });
  }
  userDisconnect = false;
  conn = 'wait'; setStatus(''); renderChips();
  const server = await dev.gatt.connect();
  db.podId = dev.id; db.podName = dev.name || ''; save();     // the pod this phone uses from now on
  const svc = await server.getPrimaryService(SVC);
  for (const [k, u] of [['time', UUID_TIME], ['info', UUID_INFO], ['ctrl', UUID_CTRL], ['data', UUID_DATA]]) chars[k] = await svc.getCharacteristic(u);
  for (const [k, u] of [['stats', UUID_STATS], ['settings', UUID_SETTINGS], ['detail', UUID_DETAIL]]) {
    try { chars[k] = await svc.getCharacteristic(u); } catch (e) { chars[k] = null; }   // newer pod firmware only
  }

  // pod clock + local time offset (the pod counts "today" / "week" / "month" for the watch)
  const now = new Uint8Array(8), nv = new DataView(now.buffer);
  nv.setUint32(0, Math.floor(Date.now() / 1000), true);
  nv.setInt32(4, -new Date().getTimezoneOffset() * 60, true);
  try { await chars.time.writeValue(now); } catch (e) { await chars.time.writeValue(now.slice(0, 4)); }   // older firmware: 4 bytes

  chars.data.addEventListener('characteristicvaluechanged', e => {
    const p = parseData(e.target.value);
    if (p.end) { if (dumpResolve) dumpResolve(p.total); dumpResolve = null; } else incoming.push(...p.recs);
  });
  await chars.data.startNotifications();
  if (chars.detail) {                              // shot details arrive together with the records
    chars.detail.addEventListener('characteristicvaluechanged', e => { for (const r of parseDetail(e.target.value)) incomingDetails.set(r.i, r.d); });
    await chars.detail.startNotifications();
  }
  chars.info.addEventListener('characteristicvaluechanged', async e => {
    const prev = info ? info.total : 0;
    info = parseInfo(e.target.value); showInfo();
    if (info.total > prev) await sync(false);     // live: new arrow shot while connected
  });
  await chars.info.startNotifications();
  if (chars.stats) {
    // the watch deleted an arrow or started a new end: fetch today's records again
    chars.stats.addEventListener('characteristicvaluechanged', async e => {
      const st = parseStats(e.target.value);
      const prev = podStats; podStats = st;
      if (prev && (st.arrows < prev.arrows || st.endMark !== prev.endMark)) await sync(true);
    });
    await chars.stats.startNotifications();
    podStats = parseStats(await chars.stats.readValue());
  }
  info = parseInfo(await chars.info.readValue());
  conn = 'ok';
  updateButtons();
  await flushOps();                                // settings changed here while offline go first
  if (chars.settings) {
    chars.settings.addEventListener('characteristicvaluechanged', e => adoptSettings(parseSettings(e.target.value)));
    await chars.settings.startNotifications();
    adoptSettings(parseSettings(await chars.settings.readValue()));
  }
  await sync(true);
}

// settings from the pod (changed on the watch or another phone): take them over
function adoptSettings(p) {
  db.podSettings = { flags: p.flags, cal: p.cal, cantRef: p.cantRef };
  if (calWait) calWait(p);
  db.settings.mount = (p.flags >> 2) & 3; $('s-mount').value = db.settings.mount;
  if (p.arrows >= 1 && p.endGap >= 20 && (p.arrows !== db.settings.arrows || p.endGap !== db.settings.endGap)) {
    db.settings.arrows = p.arrows; db.settings.endGap = p.endGap;
    db.hist.push({ from: Math.floor(Date.now() / 1000), arrows: p.arrows, endGap: p.endGap });
    $('s-arrows').value = p.arrows; $('s-endgap').value = p.endGap;
  }
  save(); render();
}
function renderCantState() {
  const ps = db.podSettings || { flags: 0, cal: 0 };
  const m = (ps.flags >> 2) & 3, where = t('mount' + m);
  $('cant-state').textContent = ps.cal === 2 ? t(m === 2 ? 'calStateSide' : 'calState', { mount: where })
    : !db.podSettings ? t('connectToSee') : t('notCal');
}

// ---------- calibration: 1. bow upright and level, 2. arrow pointed at the ground ----------
let calWait = null, calStep = 0;
const CAL_TEXT = () => [t('cal1'), t('cal2')];
function openCal() {
  calStep = 0; $('cal-text').textContent = CAL_TEXT()[0]; $('cal-msg').textContent = '';
  $('cal-next').textContent = t('next'); $('cal-next').disabled = false; $('cal').hidden = false;
}
// send a calibration step and wait for the pod's answer (its settings notification)
function calSend(cmd, want) {
  return new Promise(async (resolve, reject) => {
    const timer = setTimeout(() => { calWait = null; reject(new Error(t('podNoAnswer'))); }, 5000);
    calWait = p => { if (want.includes(p.cal)) { clearTimeout(timer); calWait = null; resolve(p); } };
    try { const c = new Uint8Array(5); c[0] = cmd; await chars.ctrl.writeValue(c); }
    catch (e) { clearTimeout(timer); calWait = null; reject(e); }
  });
}
$('setlevel').onclick = openCal;
$('cal-cancel').onclick = () => { calWait = null; $('cal').hidden = true; };
$('cal-next').onclick = async () => {
  if (calStep === 2) { $('cal').hidden = true; return; }
  if (!dev || !dev.gatt.connected || !chars.settings) { $('cal-msg').textContent = t('calConnect'); return; }
  $('cal-next').disabled = true; $('cal-msg').textContent = t('measuring');
  try {
    if (calStep === 0) {
      await calSend(9, [1]);
      calStep = 1; $('cal-text').textContent = CAL_TEXT()[1]; $('cal-next').textContent = t('finish'); $('cal-msg').textContent = '';
    } else {
      const p = await calSend(10, [2, 3]);
      if (p.cal === 2) {
        const m = (p.flags >> 2) & 3;
        $('cal-text').textContent = t(m === 2 ? 'calDoneSide' : 'calDone', { mount: t('mount' + m) });
        $('cal-msg').textContent = ''; $('cal-next').textContent = t('close'); calStep = 2;
      } else {
        calStep = 0; $('cal-text').textContent = CAL_TEXT()[0]; $('cal-next').textContent = t('next');
        $('cal-msg').textContent = t('calFail');
      }
    }
  } catch (e) { $('cal-msg').textContent = t('couldNotReach') + e.message; }
  $('cal-next').disabled = false;
};

let podStats = null;
function parseStats(dv) {
  return { arrows: dv.getUint32(0, true), today: dv.getUint16(4, true), week: dv.getUint16(6, true), month: dv.getUint16(8, true),
           mv: dv.getUint16(10, true), endMark: dv.getUint32(12, true), lastShot: dv.getUint32(16, true) };
}

// changes made on this phone, sent to the pod at the next sync
function queueDelete(indices, del) {
  const ix = [...new Set(indices)].sort((a, b) => a - b);
  for (let k = 0; k < ix.length;) {                // group into ranges of consecutive indices
    let n = 1;
    while (k + n < ix.length && ix[k + n] === ix[k] + n && n < 60000) n++;
    db.ops.push({ k: 'del', i: ix[k], n, d: del ? 1 : 0 });
    k += n;
  }
}
let flushing = null;                               // one sender at a time (a pod notification may start a sync meanwhile)
function flushOps() {
  if (!flushing) flushing = sendOps().finally(() => { flushing = null; });
  return flushing;
}
async function sendOps() {
  if (!chars.ctrl || !chars.stats || !dev || !dev.gatt.connected) return;   // pod firmware older than 1.5 doesn't know these
  while (db.ops.length) {
    const op = db.ops[0], c = new Uint8Array(8), v = new DataView(c.buffer);
    if (op.k === 'set') {
      if (chars.settings) { const b = new Uint8Array(4); b[0] = db.settings.arrows; new DataView(b.buffer).setUint16(1, db.settings.endGap, true); b[3] = db.settings.mount || 0; await chars.settings.writeValue(b); }
      db.ops.shift(); save(); continue;
    }
    if (op.k === 'del') { c[0] = 4; v.setUint32(1, op.i, true); v.setUint16(5, op.n, true); c[7] = op.d; }
    else if (op.k === 'end') { c[0] = 7; v.setUint32(1, op.t, true); }
    else if (op.k === 'resetdays') { c[0] = 6; }
    await chars.ctrl.writeValue(op.k === 'del' ? c : c.slice(0, 5));
    db.ops.shift(); save();
  }
}
function firstIndexToday() {
  const today = dayKey(new Date());
  let m = Infinity;
  for (const x of db.shots) if (x.t > 1600000000 && dayKey(new Date(x.t * 1000)) === today && x.i < m) m = x.i;
  return m;
}

let syncing = false;
async function sync(mayClear) {
  if (syncing || !chars.ctrl) return; syncing = true;
  try {
    await flushOps();
    incoming = []; incomingDetails = new Map();
    // full update: read today's records again too, so deletions / end marks from the watch arrive
    const from = Math.max(mayClear && chars.stats ? Math.min(db.nextIndex, firstIndexToday()) : db.nextIndex, info.base);
    const done = new Promise(r => { dumpResolve = r; setTimeout(() => r(null), 30000); });
    const cmd = new Uint8Array(5); cmd[0] = 1; new DataView(cmd.buffer).setUint32(1, from, true);
    await chars.ctrl.writeValue(cmd);
    const total = await done;
    const known = new Map(db.shots.map(x => [x.i, x]));
    const fresh = [];
    for (const r of incoming) {
      if (r.flags & F_END) {                         // end mark from the watch or this phone
        if (r.t > 1600000000 && !db.endMarks.includes(r.t)) { db.endMarks.push(r.t); db.endMarks.sort((a, b) => a - b); }
        continue;
      }
      const det = incomingDetails.get(r.i);
      const k = known.get(r.i);
      if (k) { k.flags = r.flags; if (det && !k.d) k.d = det; }   // deleted / restored on the pod
      else { if (det) r.d = det; fresh.push(r); known.set(r.i, r); }
    }
    db.shots.push(...fresh);
    if (total !== null) { db.nextIndex = Math.max(db.nextIndex, total); db.lastSync = Date.now(); }
    save(); render();
    info = parseInfo(await chars.info.readValue()); showInfo();
    if (fresh.length) setStatus(t('synced', { n: fresh.length }));
    else if ($('status').textContent === t('updating')) setStatus('');   // keep other messages (e.g. Undo)
    if (mayClear && total !== null && db.nextIndex >= info.total && info.storage >= db.settings.clearAt && info.total > info.base) {
      const c = new Uint8Array(5); c[0] = 2; new DataView(c.buffer).setUint32(1, info.total, true);
      await chars.ctrl.writeValue(c);
    }
  } catch (e) { setStatus(t('syncProblem') + e.message); }
  syncing = false;
}

async function choosePod() {
  if (!BT) { setStatus(t('noBt')); return; }
  try { await attach(await BT.requestDevice({ filters: [{ services: [SVC] }] })); }
  catch (e) { conn = dev && dev.gatt.connected ? 'ok' : 'off'; renderChips(); setStatus(e.name === 'NotFoundError' ? t('noPodSel') : t('couldNotConnect') + e.message); }
}
// one tap: already connected -> sync, known pod -> reconnect without the list, otherwise choose it once
$('connect').onclick = async () => {
  if (dev && dev.gatt.connected) { setStatus(t('updating')); await sync(true); return; }
  if (dev) { try { await attach(dev); } catch (e) { conn = 'off'; renderChips(); setStatus(t('pickUp')); } return; }
  await choosePod();
};
$('choose').onclick = choosePod;
$('disconnect').onclick = () => { userDisconnect = true; if (dev && dev.gatt.connected) dev.gatt.disconnect(); conn = 'off'; updateButtons(); };
// back to the page (phone unlocked, app switched): update automatically
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !dev || userDisconnect) return;
  if (dev.gatt.connected) await sync(true); else scheduleReconnect(60);
});

// Reconnect without the chooser when the browser supports remembered devices
(async () => {
  if (DEMO || !navigator.bluetooth || !navigator.bluetooth.getDevices) return;
  try {
    const list = await navigator.bluetooth.getDevices();
    // the pod chosen last time; other pods nearby are ignored
    const d = list.find(x => x.id === db.podId) || list.find(x => (x.name || '').startsWith('PfeilZaehler3000')); if (!d) return;
    conn = 'wait'; renderChips();
    if (d.watchAdvertisements) {
      const ac = new AbortController();
      d.addEventListener('advertisementreceived', async () => { ac.abort(); try { await attach(d); } catch (e) { conn = 'off'; renderChips(); setStatus(t('tapConnect')); } }, { once: true });
      await d.watchAdvertisements({ signal: ac.signal });
      setTimeout(() => { if (!d.gatt.connected) { ac.abort(); conn = 'off'; renderChips(); setStatus(t('notInRange')); } }, 15000);
    } else await attach(d);
  } catch (e) { conn = 'off'; renderChips(); }
})();

// ---------- settings & data ----------
const S = { arrows: 's-arrows', endGap: 's-endgap', sessGap: 's-sessgap', clearAt: 's-clear', dist: 's-dist' };
for (const [k, id] of Object.entries(S)) {
  $(id).value = db.settings[k];
  $(id).onchange = async e => {
    const el = e.target, v = Math.round(Number(el.value));
    if (!(v >= Number(el.min) && v <= Number(el.max))) { el.value = db.settings[k]; return; }
    db.settings[k] = v;
    if (k === 'arrows' || k === 'endGap') {        // applies from now on, earlier ends keep their values
      db.hist.push({ from: Math.floor(Date.now() / 1000), arrows: db.settings.arrows, endGap: db.settings.endGap });
      db.ops = db.ops.filter(o => o.k !== 'set'); db.ops.push({ k: 'set' });   // to the pod, the watch follows
    }
    save(); render();
    if (dev && dev.gatt.connected) { try { await flushOps(); } catch (err) {} }
  };
}
$('s-mount').value = db.settings.mount || 0;
$('s-mount').onchange = async e => {
  db.settings.mount = Number(e.target.value);
  db.ops = db.ops.filter(o => o.k !== 'set'); db.ops.push({ k: 'set' });
  save();
  if (dev && dev.gatt.connected) { try { await flushOps(); } catch (err) {} }
};
$('s-lang').value = db.settings.lang || '';
$('s-lang').onchange = e => { db.settings.lang = e.target.value; save(); applyLang(); };
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; chartMode = b.dataset.v; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); renderChart(); };

// iPhone browsers like Bluefy ignore normal downloads: use the share sheet (save to Files, AirDrop,
// mail…), and if that is not available either, show the text to copy.
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function exportText(name, text, type) {
  try {
    const file = new File([text], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  if (!isIOS) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return;
  }
  try { if (navigator.share) { await navigator.share({ title: name, text }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  showText(name, text);
}
function showText(title, text, restore = false) {
  $('box-title').textContent = title;
  $('box-text').value = text;
  $('box-text').readOnly = !restore;
  $('box-copy').hidden = restore;
  $('box-restore').hidden = !restore;
  $('box-file').hidden = !restore;
  $('box-hint').textContent = restore ? t('boxRestoreHint') : t('boxCopyHint');
  $('box').hidden = false;
}
$('box-close').onclick = () => { $('box').hidden = true; };
$('box-copy').onclick = async () => {
  const ta = $('box-text');
  try { await navigator.clipboard.writeText(ta.value); setStatus(t('copied')); $('box').hidden = true; }
  catch (e) { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); $('box-hint').textContent = t('selected'); }
};
function restoreFrom(text) {
  const d = JSON.parse(text);
  if (!Array.isArray(d.shots)) throw new Error('not a PfeilZaehler3000 backup');
  const known = new Set(db.shots.map(x => x.i));
  db.shots.push(...d.shots.filter(x => !known.has(x.i)));
  db.nextIndex = Math.max(db.nextIndex, d.nextIndex || 0);
  if (Array.isArray(d.endMarks)) db.endMarks = [...new Set([...db.endMarks, ...d.endMarks])].sort((a, b) => a - b);
  if (Array.isArray(d.hist) && d.hist.length) db.hist = d.hist;
  save(); render();
}
$('box-restore').onclick = () => {
  try { restoreFrom($('box-text').value); $('box').hidden = true; setStatus(t('backupRestored')); }
  catch (err) { $('box-hint').textContent = t('invalidBackup') + err.message; }
};
$('csv').onclick = () => {
  const rows = ['index,datetime_local,unix,peak_g,still_before_release_s,raise_s,draw_s,hold_s,aim_movement_deg,angle_deg,cant_deg,follow_down_deg,follow_right_deg,clock_exact,deleted'];
  const v = x => x === null || x === undefined ? '' : x;
  for (const x of [...db.shots].sort((a, b) => a.t - b.t)) {
    const d = x.d || {};
    rows.push([x.i, x.t > 1600000000 ? new Date(x.t * 1000).toLocaleString('sv') : '', x.t, x.peak, x.aim,
      v(d.raise), v(d.draw), v(d.hold), v(d.move), v(d.pitch), v(d.cant), v(d.drop), v(d.side),
      x.flags & 1, x.flags & F_DEL ? 1 : 0].join(','));
  }
  exportText('PfeilZaehler3000.csv', rows.join('\n'), 'text/csv');
};
$('backup').onclick = () => exportText('PfeilZaehler3000-backup.json', JSON.stringify(db), 'application/json');
$('restore').onclick = () => showText(t('restoreTitle'), '', true);
$('box-file').onclick = () => $('file').click();
$('file').onchange = async e => {
  try { restoreFrom(await e.target.files[0].text()); $('box').hidden = true; setStatus(t('backupRestored')); }
  catch (err) { setStatus(t('restoreFailed') + err.message); }
  e.target.value = '';
};

// New end: no confirmation. The next arrow starts a new end.
$('newend').onclick = async () => {
  const now = Math.floor(Date.now() / 1000);
  db.endMarks.push(now);
  if (db.endMarks.length > 500) db.endMarks = db.endMarks.slice(-500);
  db.ops.push({ k: 'end', t: now });                // tell the pod, so the watch starts a new end too
  save(); render();
  setStatus(t('newEndStarted'));
  if (dev && dev.gatt.connected) { try { await flushOps(); } catch (e) {} }
};

// Reset today: delete today's arrows on this phone (with confirmation).
$('resetday').onclick = async () => {
  const today = dayKey(new Date());
  const list = live().filter(x => x.t > 1600000000 && dayKey(new Date(x.t * 1000)) === today);
  if (!confirm(t('confirmResetToday', { n: list.length }))) return;
  await deleteArrows(list, true);
  const now = Math.floor(Date.now() / 1000);
  db.endMarks.push(now); db.ops.push({ k: 'end', t: now });
  save(); render();
  setStatus(t('todayDeleted', { n: list.length }));
};

// ---------- the arrows of one end: delete, restore, details ----------
let lastDeleted = null;
async function deleteArrows(list, del) {
  for (const x of list) x.flags = del ? (x.flags | F_DEL) : (x.flags & ~F_DEL);
  queueDelete(list.map(x => x.i), del);
  save(); render();
  if (dev && dev.gatt.connected) { try { await flushOps(); } catch (e) {} }
}
let sheetEnd = null, sheetNo = 0, openRows = new Set();
function openSheet(end, no) {
  sheetEnd = end; sheetNo = no; openRows = new Set();
  $('sheet-title').textContent = t('sheetTitle', { e: no, arrows: t('arrows', { n: end.n }) });
  $('sheet-sub').textContent = `${fmtDate(end.start)}, ${fmtTime(end.start)} · ${t('perEnd', { n: end.arrows })}`;
  renderSheet();
  $('sheet').hidden = false;
}
function detailHtml(x) {
  const d = x.d, rows = [];
  if (d) {
    const esc = v => v.replace(/&/g, '&amp;');
    rows.push([esc(t('dRaise')), d.raise !== null ? f1(d.raise) + ' s' : '–'], [esc(t('dDraw')), d.draw !== null ? f1(d.draw) + ' s' : '–']);
    rows.push([t('dHold'), d.hold !== null ? f1(d.hold) + ' s' : '–'], [t('dMove'), fmtMove(d.move)]);
    rows.push([t('dAngle'), d.pitch === null ? '–' : (d.pitch >= 0 ? '+' : '') + d.pitch.toFixed(1) + '°'], [t('dCant'), fmtCant(d.cant)]);
    rows.push([t('dFollow'), fmtFollow(d)], [t('dJolt'), x.peak + ' g']);
  } else {
    rows.push([t('dStill'), x.aim + ' s'], [t('dJolt'), x.peak + ' g']);
    rows.push([t('noDetails'), null]);
  }
  rows.push([t('dTime', { t: new Date(x.t * 1000).toLocaleTimeString(LOC, { hour: '2-digit', minute: '2-digit', second: '2-digit' }) }), null]);
  return rows.map(([k, v]) => v === null ? `<div class="full small">${k}</div>` : `<div><span class="k">${k}</span><br>${v}</div>`).join('');
}
function renderSheet() {
  const list = sheetEnd.list;
  $('sheet-avg').textContent = avgLine(summary(list.filter(x => !(x.flags & F_DEL))));
  $('sheet-list').innerHTML = list.map((x, k) => {
    const gone = x.flags & F_DEL;
    const when = k === 0 ? fmtTime(x.t) : fmtSplit(x.t - list[k - 1].t);
    const quick = x.d && x.d.hold !== null ? `<span class="small">${t('avgHold', { v: f1(x.d.hold) })}</span>` : '';
    return `<div class="arow${gone ? ' gone' : ''}${openRows.has(k) ? ' open' : ''}" data-row="${k}"><div class="line">` +
      `<span class="no">${k + 1}</span><span class="tm" data-open="${k}" role="button" aria-expanded="${openRows.has(k)}">${when} ${quick}${icon('chev', 'i chev')}</span>` +
      (gone ? `<button class="icon-btn undo" data-k="${k}" aria-label="${t('restoreArrow', { n: k + 1 })}" title="${t('restoreArrowTip')}">${icon('undo')}</button>`
            : `<button class="icon-btn del" data-k="${k}" aria-label="${t('deleteArrow', { n: k + 1 })}" title="${t('del')}">${icon('trash')}</button>`) +
      `</div><div class="det">${detailHtml(x)}</div></div>`;
  }).join('');
}
$('sessions').onclick = e => {
  const b = e.target.closest('button.end'); if (!b) return;
  const end = shownSessions[+b.dataset.s] && shownSessions[+b.dataset.s].ends[+b.dataset.e];
  if (end) openSheet(end, +b.dataset.e + 1);
};
$('sheet-list').onclick = async e => {
  const o = e.target.closest('[data-open]');
  if (o) { const k = +o.dataset.open; openRows.has(k) ? openRows.delete(k) : openRows.add(k); renderSheet(); return; }
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const x = sheetEnd.list[+b.dataset.k];
  await deleteArrows([x], !(x.flags & F_DEL));
  renderSheet();
};
$('sheet-delend').onclick = async () => {
  const list = sheetEnd.list.filter(x => !(x.flags & F_DEL));
  $('sheet').hidden = true;
  if (!list.length) return;
  await deleteArrows(list, true);
  lastDeleted = list;
  setStatus(`${t('endDeleted', { n: list.length })} <button class="btn ghost" id="undo">${t('undo')}</button>`);
};
$('sheet-done').onclick = () => { $('sheet').hidden = true; };
$('status').onclick = async e => {
  if (!e.target.closest('#undo') || !lastDeleted) return;
  await deleteArrows(lastDeleted, false);
  setStatus(t('restoredN', { n: lastDeleted.length }));
  lastDeleted = null;
};

// Reset: delete the whole history on this phone. Arrows already on the pod are NOT imported
// again (nextIndex is kept), and if the pod is connected its memory is cleared as well.
$('reset').onclick = async () => {
  const n = db.shots.length;
  if (!confirm(t('confirmResetAll', { n }))) return;
  if (chars.ctrl && dev && dev.gatt.connected) {
    try {
      await sync(false);                                   // pick up anything new first, so it is not imported later
      info = parseInfo(await chars.info.readValue());
      const c = new Uint8Array(5); c[0] = 2; new DataView(c.buffer).setUint32(1, info.total, true);
      await chars.ctrl.writeValue(c);                      // clear the pod's memory
      if (chars.stats) { const z = new Uint8Array(5); z[0] = 6; await chars.ctrl.writeValue(z); }   // and its day counters
      db.nextIndex = Math.max(db.nextIndex, info.total);
    } catch (e) { /* phone data is reset anyway */ }
  }
  db.shots = [];
  db.endMarks = [];
  db.ops = db.ops.filter(o => o.k === 'set');
  save(); render();
  setStatus(t('allReset') + (dev && dev.gatt.connected ? t('podCleared') : ''));
};

// language: static texts, then everything drawn by script
function applyLang() {
  LANG = pickLang(db.settings.lang); LOC = LOCALES[LANG];
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  render(); updateButtons();
  if (!$('sheet').hidden && sheetEnd) { $('sheet-title').textContent = t('sheetTitle', { e: sheetNo, arrows: t('arrows', { n: sheetEnd.n }) }); renderSheet(); }
}
applyLang();
setInterval(() => { $('t-end').textContent = currentEnd(); }, 10000);
if (typeof window !== 'undefined') window.PfeilZaehler3000 = { groupSessions, totals, buckets, parseData, parseInfo, parseStats, parseDetail, parseSettings, summary, fmtSplit, currentEnd, queueDelete, getDb: () => db };
