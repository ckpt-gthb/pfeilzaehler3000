<title>PfeilZaehler3000 report</title>
<style>
/* Report: one column of chart panels, a note beside each chart (below it on a phone) */
:root{
  --bg:#f5f3ee;--card:#fffdf8;--ink:#1d211e;--ink2:#474d48;--muted:#6b716c;--line:#e2ded4;--grid:#ebe7de;--axis:#c9c4b8;
  --accent:#2f6b4f;--accent-soft:#dcebe2;--s1:#2f6b4f;--s1l:#9cc5ae;--s2:#c0622a;--band:rgba(47,107,79,.07);
  --gold:#e6b800;--red:#d23c32;--blue:#2f7fd0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141715;--card:#1c201d;--ink:#e9ece8;--ink2:#c4cac5;--muted:#9aa29c;--line:#2c322e;--grid:#262b27;--axis:#3a413c;
  --accent:#7cc39c;--accent-soft:#1f3a2c;--s1:#7cc39c;--s1l:#3f6e56;--s2:#e8945f;--band:rgba(124,195,156,.08);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141715;--card:#1c201d;--ink:#e9ece8;--ink2:#c4cac5;--muted:#9aa29c;--line:#2c322e;--grid:#262b27;--axis:#3a413c;
  --accent:#7cc39c;--accent-soft:#1f3a2c;--s1:#7cc39c;--s1l:#3f6e56;--s2:#e8945f;--band:rgba(124,195,156,.08);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
.top select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
h1{font-size:26px;line-height:1.15;margin:4px 0 0;text-wrap:balance}
.lede{color:var(--ink2);max-width:70ch;margin:6px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:10px}
.stat{display:grid}
.stat b{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;border-radius:8px;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--accent);color:var(--bg)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px}
.nav{display:flex;align-items:center;gap:6px}
.nav button,.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer}
.nav button{width:38px;height:38px;font-size:18px;line-height:1}
.nav button:disabled{opacity:.35;cursor:default}
.nav span{min-width:9em;text-align:center;font-weight:600}
.ctrl label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.ctrl input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.btn{padding:9px 14px;font-weight:600;color:var(--accent);min-height:44px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink2)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 -6px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 12px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:0}
@media (max-width:760px){.panel{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.pair{grid-template-columns:minmax(0,1fr)}}
.chart{min-width:0}
.chart h3{font-size:15px;margin:0 0 2px}
.chart .sub{font-size:12px;color:var(--muted);margin:0 0 6px}
.note{font-size:14px;color:var(--ink2);min-width:0}
.note p{margin:0 0 8px}
.note b{color:var(--ink)}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:inherit;font-variant-numeric:tabular-nums}
.tk{font-size:11px;fill:var(--muted)}
.al{font-size:11px;fill:var(--ink2)}
.an{font-size:11.5px;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.gl{stroke:var(--grid);stroke-width:1}
.ax{stroke:var(--axis);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin:2px 0 4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;line-height:1.4;padding:6px 8px;border-radius:6px;max-width:260px;z-index:20;opacity:0;left:0;top:0}
[data-tip]{cursor:default}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--grid)}
th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--card)}
tr.del td{color:var(--muted);text-decoration:line-through}
footer{font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <a href="./" id="back"></a>

    <h1 id="title">PfeilZaehler3000</h1>
    <p class="lede" id="lede"></p>
    <div class="stats" id="stats"></div>

  <nav class="tabs" id="tabs">
    <button data-v="day" class="on"></button><button data-v="week"></button><button data-v="month"></button><button data-v="all"></button>
  </nav>
  <div class="ctrl">
    <div class="nav" id="nav"><button id="prev" aria-label="previous">‹</button><span id="plabel"></span><button id="next" aria-label="next">›</button></div>
    <label><span id="from-l"></span> <input type="date" id="from"></label>
  </div>
  <div id="out"></div>
  <div class="actions">
    <button class="btn" id="open"></button>
    <button class="btn" id="save"></button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
  <footer id="foot"></footer>
</div>

// ---------- formatting ----------
const f1 = v => num(v) ? v.toLocaleString(LOC, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : '–';
const f2 = v => num(v) ? v.toLocaleString(LOC, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '–';
const f0 = v => num(v) ? Math.round(v).toLocaleString(LOC) : '–';
const sg = v => (v > 0 ? '+' : v < 0 ? '−' : '') + f1(Math.abs(v));
const cm = deg => Math.tan(deg * Math.PI / 180) * DB.settings.dist * 100;
const fMove = deg => num(deg) ? `${f2(deg)}° ≈ ${f1(cm(deg))} cm` : '–';
const fCant = c => !num(c) ? '–' : Math.abs(c) < 0.05 ? '0°' : `${f1(Math.abs(c))}° ${c > 0 ? t('right') : t('left')}`;
const fTime = ts => new Date(ts * 1000).toLocaleTimeString(LOC, { hour: '2-digit', minute: '2-digit' });
const fTimeS = ts => new Date(ts * 1000).toLocaleTimeString(LOC, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const fDate = d => d.toLocaleDateString(LOC, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
const fTitle = d => d.toLocaleDateString(LOC, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });   // fits one line on a phone
const fDateS = d => d.toLocaleDateString(LOC, { day: 'numeric', month: 'numeric' });
const fDay = d => d.toLocaleDateString(LOC, { weekday: 'short', day: 'numeric', month: 'numeric' });
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

// ---------- charts (SVG, drawn for the width of their box) ----------
function niceTicks(lo, hi, n = 4) {
  if (!num(lo) || !num(hi)) { lo = 0; hi = 1; }
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, p = 10 ** Math.floor(Math.log10(raw)), e = raw / p;
  const step = (e < 1.5 ? 1 : e < 3 ? 2 : e < 7 ? 5 : 10) * p;
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= hi + step * 0.5; v += step) out.push(+v.toFixed(10));
  if (out[out.length - 1] < hi) out.push(+(out[out.length - 1] + step).toFixed(10));
  return out;
}
const S = (d0, d1, r0, r1) => v => r0 + (v - d0) / ((d1 - d0) || 1) * (r1 - r0);
function frame(o) {
  const W = o.W, H = o.H, m = Object.assign({ l: 44, r: 10, t: 12, b: o.xl ? 38 : 26 }, o.m || {});
  const sx = S(o.x[0], o.x[1], m.l, W - m.r), sy = S(o.y[0], o.y[1], H - m.b, m.t);
  let g = '';
  for (const v of o.yt) g += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${sy(v)}" y2="${sy(v)}"/><text class="tk" x="${m.l - 6}" y="${sy(v) + 4}" text-anchor="end">${(o.yf || String)(v)}</text>`;
  for (const [v, l] of o.xt || []) g += `<text class="tk" x="${sx(v)}" y="${H - m.b + 15}" text-anchor="middle">${esc(l)}</text>`;
  g += `<line class="ax" x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}"/>`;
  if (o.xl) g += `<text class="al" x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle">${esc(o.xl)}</text>`;
  if (o.yl) g += `<text class="al" transform="translate(11 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle">${esc(o.yl)}</text>`;
  return { W, H, m, sx, sy, g, open: `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.label || '')}">` };
}
const dot = (x, y, c, tip, r = 4.5) => `<g data-tip="${esc(tip)}"><circle cx="${x}" cy="${y}" r="11" fill="transparent"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="var(--card)" stroke-width="1.5"/></g>`;
const thin = (n, W) => Math.max(1, Math.ceil(n / Math.max(2, Math.floor(W / 46))));   // label every k-th category
const yr = (vals, pad = 0.08, zero = false) => {
  const v = vals.filter(num); if (!v.length) return [0, 1];
  let lo = Math.min(...v), hi = Math.max(...v); if (zero) lo = Math.min(0, lo);
  const p = (hi - lo || Math.abs(hi) || 1) * pad; return [zero && lo === 0 ? 0 : lo - p, hi + p];
};
// categories along x: bars (stacked), dots with ± lines, and lines inside groups; bands mark blocks
function catChart(o, W) {
  const n = o.cats.length, H = o.H || 230;
  const all = [];
  for (const s of o.series) s.values.forEach((v, k) => { if (num(v)) { all.push(s.stack ? o.series.filter(q => q.stack).reduce((a, q) => a + (num(q.values[k]) ? q.values[k] : 0), 0) : v); if (s.sd && num(s.sd[k])) all.push(v - s.sd[k], v + s.sd[k]); } });
  const [lo, hi] = o.y || yr(all, 0.1, o.series.some(s => s.kind === 'bar'));
  const yt = niceTicks(lo, hi, o.ticks || 4);
  const dec = Math.max(0, -Math.floor(Math.log10((yt[1] - yt[0]) || 1) + 1e-9));
  const yf = o.yu !== undefined ? v => v.toLocaleString(LOC, { minimumFractionDigits: dec, maximumFractionDigits: dec }) + o.yu : o.yf;
  const f = frame({ W, H, x: [-0.6, n - 0.4], y: [yt[0], yt[yt.length - 1]], yt, yf, xl: o.xl, label: o.label,
    xt: o.cats.map((c, k) => [k, c]).filter((c, k) => k % thin(n, W - 54) === 0 && !o.noXLabels), m: o.m });
  let g = f.g;
  const step = (f.sx(1) - f.sx(0)) || 40;
  for (const b of o.bands || []) {
    const x0 = f.sx(b.from - 0.5), x1 = f.sx(b.to + 0.5);
    g += `<rect x="${x0}" y="${f.m.t}" width="${x1 - x0}" height="${f.H - f.m.b - f.m.t}" fill="var(--band)"/>`;
    if (x1 - x0 > 44) g += `<text class="tk" x="${(x0 + x1) / 2}" y="${f.m.t + 11}" text-anchor="middle">${esc(b.label)}</text>`;
  }
  if (o.zero && yt[0] < 0) g += `<line x1="${f.m.l}" x2="${f.W - f.m.r}" y1="${f.sy(0)}" y2="${f.sy(0)}" stroke="var(--axis)" stroke-width="1.5"/>`;
  const bw = Math.max(3, Math.min(34, step * 0.66)), base = f.sy(Math.max(yt[0], 0));
  const stackTop = new Array(n).fill(0);
  for (const s of o.series.filter(q => q.kind === 'bar')) {
    s.values.forEach((v, k) => {
      if (!num(v) || v === 0) return;
      const y0 = f.sy(stackTop[k]), y1 = f.sy(stackTop[k] + v); stackTop[k] += s.stack ? v : 0;
      const x = f.sx(k) - bw / 2, r = Math.min(3, bw / 3, (y0 - y1) / 2);
      g += `<g data-tip="${esc(s.tips ? s.tips[k] : '')}"><rect x="${x - 2}" y="${f.m.t}" width="${bw + 4}" height="${f.H - f.m.b - f.m.t}" fill="transparent"/>` +
           `<path d="M${x},${y0} V${y1 + r} q0,-${r} ${r},-${r} h${bw - 2 * r} q${r},0 ${r},${r} V${y0} Z" fill="${s.color}"/></g>`;
      if (s.labels && bw >= 16) g += `<text class="tk" x="${f.sx(k)}" y="${y1 - 5}" text-anchor="middle">${esc(s.labels[k])}</text>`;
    });
  }
  for (const s of o.series.filter(q => q.kind !== 'bar')) {
    let pts = [];
    const flush = () => { if (pts.length > 1) g += `<polyline fill="none" stroke="${s.color}" stroke-opacity="${s.lineOpacity || 0.5}" stroke-width="2" points="${pts.join(' ')}"/>`; pts = []; };
    s.values.forEach((v, k) => {
      if (!num(v) || (s.group && k && s.group[k] !== s.group[k - 1])) flush();
      if (num(v) && s.line !== false) pts.push(f.sx(k) + ',' + f.sy(v));
    });
    flush();
    s.values.forEach((v, k) => {
      if (!num(v)) return;
      if (s.sd && num(s.sd[k])) g += `<line x1="${f.sx(k)}" x2="${f.sx(k)}" y1="${f.sy(v - s.sd[k])}" y2="${f.sy(v + s.sd[k])}" stroke="${s.color}" stroke-width="2" stroke-opacity=".7"/>`;
      g += dot(f.sx(k), f.sy(v), s.color, s.tips ? s.tips[k] : '', s.r || (n > 60 ? 3 : 4.5));
    });

}
function scatter(o, W) {
  const H = o.H || 260, pts = o.pts.filter(p => num(p.x) && num(p.y));
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const xt = niceTicks(...yr(xs.concat(0), 0.1), Math.max(3, Math.floor(W / 90))), yt = niceTicks(...yr(ys.concat(0), 0.1), 4);
  const f = frame({ W, H, x: [xt[0], xt[xt.length - 1]], y: [yt[0], yt[yt.length - 1]], yt, yf: v => v.toLocaleString(LOC) + o.unit,
    xt: xt.map(v => [v, v.toLocaleString(LOC) + o.unit]), xl: o.xl, yl: o.yl, m: { l: 52 }, label: o.label });
  let g = f.g;
  g += `<line x1="${f.sx(0)}" x2="${f.sx(0)}" y1="${f.m.t}" y2="${f.H - f.m.b}" stroke="var(--axis)" stroke-dasharray="3 3"/>`;
  g += `<line x1="${f.m.l}" x2="${f.W - f.m.r}" y1="${f.sy(0)}" y2="${f.sy(0)}" stroke="var(--axis)" stroke-dasharray="3 3"/>`;
  const seen = {};                                 // spread out equal points
  for (const p of pts) {
    const k = p.x + '|' + p.y, j = (seen[k] = (seen[k] || 0) + 1) - 1, a = j * 2.4, r = j ? 3 + j * 1.2 : 0;
    g += dot(f.sx(p.x) + r * Math.cos(a), f.sy(p.y) + r * Math.sin(a), p.color || 'var(--s1)', p.tip, pts.length > 150 ? 3 : 4);
  }
  if (pts.length > 1) {
    const mx = mean(xs), my = mean(ys);
    g += `<path d="M${f.sx(mx) - 10},${f.sy(my)} h20 M${f.sx(mx)},${f.sy(my) - 10} v20" stroke="var(--ink)" stroke-width="2.5"/>`;
  }
  return f.open + g + '</svg>';
}

// ---------- the report ----------
let charts = [];                                   // [id, (width) => svg]
function panel(title, sub, id, draw, notes, legend = '') {
  charts.push([id, draw]);
  return `<section class="panel"><div class="chart"><h3>${esc(title)}</h3><p class="sub">${esc(sub)}</p>${legend}<div id="${id}"></div></div>` +
         `<div class="note">${notes.map(n => `<p>${n}</p>`).join('')}</div></section>`;
}
function pairPanel(parts, notes) {
  let h = '<section class="panel"><div class="pair">';
  for (const [title, sub, id, draw] of parts) { charts.push([id, draw]); h += `<div class="chart"><h3>${esc(title)}</h3><p class="sub">${esc(sub)}</p><div id="${id}"></div></div>`; }
  return h + `</div><div class="note">${notes.map(n => `<p>${n}</p>`).join('')}</div></section>`;
}
const legend = items => `<div class="legend">${items.map(([c, l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`;
const arrowTip = x => t('tipArrow', { i: x.i, time: fTimeS(x.t), e: x.end.n, p: x.pos });

// cant drift: slope inside each end with at least 3 cant values
function cantDrift(ends) {
  const sl = [];
  for (const e of ends) { const c = e.list.filter(okCant).map(x => x.d.cant); if (c.length >= 3) sl.push({ e, s: slope(c) }); }
  if (sl.length < 3) return null;
  const pos = sl.filter(x => x.s > 0).length, share = Math.max(pos, sl.length - pos) / sl.length, med = median(sl.map(x => x.s));
  if (share < 0.6 || Math.abs(med) < 0.4) return null;
  const steep = sl.reduce((a, b) => Math.abs(b.s) > Math.abs(a.s) ? b : a);
  return { p: Math.round(share * 100), v: f1(Math.abs(med)), e: steep.e.n, s: f1(Math.abs(steep.s)) };
}
function cantSpread(ends) { return mean(ends.map(e => sdev(e.list.filter(okCant).map(x => x.d.cant))).filter(num)); }
// arrow-in-the-end effect: hold and aim movement by position
function byPos(list) {
  const maxP = Math.min(12, Math.max(0, ...list.map(x => x.pos)));
  const P = [];
  for (let p = 1; p <= maxP; p++) {
    const s = list.filter(x => x.pos === p);
    P.push({ p, n: s.length, hold: mean(s.filter(x => has(x, 'hold')).map(x => x.d.hold)), move: mean(s.filter(x => has(x, 'move')).map(x => x.d.move)) });
  }
  while (P.length && P[P.length - 1].n < Math.max(3, P[0].n * 0.3)) P.pop();   // a rare 7th arrow is no position
  return P;
}
function posNotes(P) {
  const out = [];
  if (P.length < 3) return out;
  const last = P.slice(-2), a = P[0].hold, b = mean(last.map(x => x.hold).filter(num));
  if (num(a) && num(b)) out.push(a - b >= 0.3 ? t('nPosHold', { a: f1(a), b: f1(b), d: f1(a - b) }) : t('nPosHoldEven', { a: f1(a), b: f1(b) }));
  const m1 = P[0].move, m2 = mean(last.map(x => x.move).filter(num));
  if (num(m1) && num(m2) && m1 > 0) { const p = Math.round((m2 / m1 - 1) * 100); out.push(Math.abs(p) < 10 ? t('nPosMoveEven') : t(p > 0 ? 'nPosMoveUp' : 'nPosMoveDown', { p: Math.abs(p) })); }
  return out;
}
function posPair(list, sub) {
  const P = byPos(list);
  if (P.length < 2 || !P.some(x => num(x.hold))) return '';
  const mk = (key, fmt, yu) => W => catChart({ cats: P.map(x => String(x.p)), xl: t('thArrow'), H: 200, yu, label: t(key === 'hold' ? 'cPosHold' : 'cPosMove'),
    series: [{ kind: 'bar', color: 'var(--s1)', values: P.map(x => x[key]), labels: P.map(x => fmt(x[key])), tips: P.map(x => `${t('thArrow')} ${x.p} · ${key === 'hold' ? f2(x.hold) + ' s' : fMove(x.move)} · ${t('arrows', { n: x.n })}`) }] }, W);
  return pairPanel([[t('cPosHold'), sub, 'c-pos-hold', mk('hold', f1, ' s')], [t('cPosMove'), sub, 'c-pos-move', mk('move', f2, '°')]], posNotes(P));
}
function ftPanel(list, id) {
  const L = list.filter(x => has(x, 'drop') && has(x, 'side'));
  if (L.length < 2) return '';
  const md = mean(L.map(x => x.d.drop)), ms = mean(L.map(x => x.d.side));
  const note = t('nFt', { dd: md < 0 ? t('back') : t('forward'), d: f1(Math.abs(md)), s: f1(Math.abs(ms)), sd: ms < 0 ? t('left') : t('right'),
                          a: f1(sdev(L.map(x => x.d.drop))), b: f1(sdev(L.map(x => x.d.side))) });
  return panel(t('cFt'), t('cFtSub'), id, W => scatter({ pts: L.map(x => ({ x: x.d.side, y: x.d.drop, tip: `${x.end ? arrowTip(x) : '#' + x.i} · ${t('lBack')} ${f1(-x.d.drop)}° · ${t('lLeft')} ${f1(-x.d.side)}°` })),
    unit: '°', xl: t('ftX'), yl: t('ftY'), label: t('cFt') }, W), [note]);
}
function pushPanel(list, id) {
  const L = list.filter(x => has(x, 'pushDown') && has(x, 'pushRight'));
  if (!L.length) return '';
  const withD = list.filter(x => x.d).length;
  const md = mean(L.map(x => x.d.pushDown)), mr = mean(L.map(x => x.d.pushRight));
  const notes = [t('nPush', { d: f1(Math.abs(md)), dd: md >= 0 ? t('down') : t('up'), r: f1(Math.abs(mr)), rr: mr >= 0 ? t('right') : t('left'),
                              a: f1(sdev(L.map(x => x.d.pushDown))), b: f1(sdev(L.map(x => x.d.pushRight))) })];
  if (L.length < withD * 0.8) notes.push(t('nPushFew', { n: `${L.length}/${withD}` }));
  return panel(t('cPush'), t('cPushSub'), id, W => scatter({ pts: L.map(x => ({ x: x.d.pushRight, y: -x.d.pushDown, tip: `${x.end ? arrowTip(x) : '#' + x.i} · ${Math.abs(x.d.pushDown)} mm ${x.d.pushDown >= 0 ? t('down') : t('up')}, ${Math.abs(x.d.pushRight)} mm ${x.d.pushRight >= 0 ? t('right') : t('left')}` })),
    unit: ' mm', xl: t('pushX'), yl: t('pushY'), label: t('cPush') }, W), notes);

function renderDay(key) {
  const fromTs = fromDate().getTime() / 1000;
  const ends = A.ends.filter(e => e.day === key && e.start >= fromTs), list = ends.flatMap(e => e.list);
  const del = A.deleted.filter(x => keyOf.day(x.t) === key && x.t >= fromTs);
  const withD = list.filter(x => x.d);
  const scored = ends.filter(e => e.score), pts = scored.reduce((s, e) => s + e.score.sum, 0), nSc = scored.reduce((s, e) => s + e.score.v.length, 0);
  const blocks = ends.length ? ends[ends.length - 1].block : 0;
  $('title').textContent = t('titleDay', { date: fTitle(dateOfKey(key)) });
  $('lede').innerHTML = (list.length ? t('ledeDay', { arrows: t('arrows', { n: list.length }), t0: fTime(list[0].t), t1: fTime(list[list.length - 1].t),
    ends: t('ends', { n: ends.length }), blocks: t('blocks', { n: blocks }) }) + ' ' : '') + srcText() + ' ' + t('hoverTip');
  const aim = withD.map(aimT).filter(num);
  stats([[list.length, t('stArrows')], [ends.length, t('stEnds')], nSc ? [pts, t('stPoints')] : null, nSc ? [f2(pts / nSc), t('stPerArrow')] : null,
         aim.length ? [f1(median(aim)) + ' s', t('stAimT')] : null, withD.some(x => has(x, 'move')) ? [fMove(median(withD.filter(x => has(x, 'move')).map(x => x.d.move))), t('stMove')] : null,
         [f1(mean(list.map(x => x.aim).filter(num))) + ' s', t('stStill')], del.length ? [del.length, t('stFalse')] : null]);
  let h = '', hCant = '', hMove = '', hAim = '', hScore = '';
  if (!withD.length) h += `<div class="msg">${t('noDetails')}</div>`;
  // block bands over the arrows in shooting order
  const bandsBy = (items, endOf) => { const b = []; items.forEach((it, k) => { const e = endOf(it); if (!b.length || b[b.length - 1].b !== e.block) b.push({ b: e.block, from: k, to: k }); else b[b.length - 1].to = k; });
    return b.length > 1 ? b.map(x => ({ from: x.from, to: x.to, label: t('block', { b: x.b }) })) : []; };
  // cant
  const C = list.filter(okCant), out = withD.filter(x => has(x, 'cant') && !okCant(x)).length;
  if (C.length >= 3) {
    const notes = [], dr = cantDrift(ends);
    if (dr) notes.push(t('nCantDrift', dr));
    else for (let b = 1, found = 0; b <= blocks; b++) {   // slow turning over a whole block
      const s = C.filter(x => x.end.block === b).map(x => x.d.cant);
      if (s.length < 9) continue;
      const k = slope(s), tot = k * (s.length - 1);
      if (Math.abs(tot) >= 3 && Math.abs(k) >= 0.1) { notes.push(t('nCantBlock', { b, v: fCant(tot), n: s.length, s: f2(Math.abs(k)) })); found++; }
      if (b === blocks && found) notes.push(t('nCantFix'));
    }
    const sp = cantSpread(ends); if (num(sp)) notes.push(t('nCantSpread', { v: f1(sp), m: fCant(mean(C.map(x => x.d.cant))) }));
    if (out) notes.push(t('nCantOut', { n: out }));
    hCant = panel(t('cCant'), t('cCantSub'), 'c-cant', W => catChart({ cats: C.map(x => fTime(x.t)), noXLabels: true, H: 250, zero: true, yf: v => (v > 0 ? '+' : '') + v + '°', label: t('cCant'),
      bands: bandsBy(C, x => x.end), series: [{ kind: 'dot', color: 'var(--s1)', values: C.map(x => x.d.cant), group: C.map(x => x.end.n), r: 4,
      tips: C.map(x => arrowTip(x) + ' · ' + t('tipCant', { v: sg(x.d.cant) })) }] }, W), notes);
  }
  // aim movement per end
  const EM = ends.map(e => ({ e, m: mean(e.list.filter(x => has(x, 'move')).map(x => x.d.move)) })).filter(x => num(x.m));
  if (EM.length >= 2) {
    const notes = [];
    for (let b = 1; b <= blocks; b++) {
      const s = EM.filter(x => x.e.block === b);
      if (s.length >= 3 && s[s.length - 1].m > s[0].m * 1.25 && slope(s.map(x => x.m)) > 0) notes.push(t('nMoveRise', { b, a: fMove(s[0].m), c: fMove(s[s.length - 1].m), n: s.length }));
    }
    const lo = EM.reduce((a, b) => b.m < a.m ? b : a), hi = EM.reduce((a, b) => b.m > a.m ? b : a);
    notes.push(t('nMoveFlat', { v: fMove(mean(EM.map(x => x.m))), lo: lo.e.n, hi: hi.e.n }));
    hMove = panel(t('cMoveEnd'), t('cMoveSub', { cm: f1(cm(1)), dist: DB.settings.dist }), 'c-move', W => catChart({ cats: EM.map(x => String(x.e.n)), xl: t('thEnd'), yu: '°', label: t('cMoveEnd'),
      bands: bandsBy(EM, x => x.e), series: [{ kind: 'dot', color: 'var(--s1)', values: EM.map(x => x.m), group: EM.map(x => x.e.block), lineOpacity: 0.8,
      tips: EM.map(x => `${t('tipEnd', { e: x.e.n, time: fTime(x.e.start), n: t('arrows', { n: x.e.list.length }) })} · ${fMove(x.m)}`) }] }, W), notes);
  }
  const hPos = posPair(withD, t('cPosSub'));
  // time at aiming height
  const AT = withD.filter(x => num(aimT(x)));
  if (AT.length >= 2) {
    const notes = [t('nAim', { v: f1(median(AT.map(aimT))), d: f1(median(AT.map(x => x.d.draw))), h: f1(median(AT.map(x => x.d.hold))), min: f1(Math.min(...AT.map(aimT))), max: f1(Math.max(...AT.map(aimT))) })];
    const short = AT.filter(x => x.d.draw <= 0.2).length; if (short) notes.push(t('nAimShort', { n: short }));
    const tips = AT.map(x => `${arrowTip(x)} · ${t('lDraw')} ${f1(x.d.draw)} s + ${t('lHold')} ${f1(x.d.hold)} s = ${f1(aimT(x))} s`);
    hAim = panel(t('cAim'), t('cAimSub'), 'c-aim', W => catChart({ cats: AT.map(x => fTime(x.t)), noXLabels: true, yu: ' s', label: t('cAim'), bands: bandsBy(AT, x => x.end),
      series: [{ kind: 'bar', stack: true, color: 'var(--s1l)', values: AT.map(x => x.d.draw), tips }, { kind: 'bar', stack: true, color: 'var(--s1)', values: AT.map(x => x.d.hold), tips }] }, W),
      notes, legend([['var(--s1l)', t('lDraw')], ['var(--s1)', t('lHold')]]));
  }
  const hFt = ftPanel(withD, 'c-ft'), hPush = pushPanel(withD, 'c-push');
  // scores
  if (scored.length) {
    const best = scored.reduce((a, b) => b.score.sum > a.score.sum ? b : a), worst = scored.reduce((a, b) => b.score.sum < a.score.sum ? b : a);
    const notes = [t('nScore', { sum: pts, ends: t('ends', { n: scored.length }), avg: f2(pts / nSc), best: best.score.sum, be: best.n, worst: worst.score.sum, we: worst.n })];
    if (scored.length < ends.length) notes.push(t('nUnscored', { n: ends.length - scored.length }));
    hScore = panel(t('cScore'), t('cScoreSub'), 'c-score', W => catChart({ cats: ends.map(e => String(e.n)), xl: t('thEnd'), label: t('cScore'),
      series: [{ kind: 'bar', color: 'var(--s1)', values: ends.map(e => e.score ? e.score.sum : null), labels: ends.map(e => e.score ? String(e.score.sum) : ''),
      tips: ends.map(e => `${t('tipEnd', { e: e.n, time: fTime(e.start), n: t('arrows', { n: e.list.length }) })}${e.score ? ' · ' + e.score.v.map(valText).join(' ') + ' = ' + e.score.sum : ''}`) }] }, W), notes);
  } else hScore = `<div class="msg">${t('nNoScore')}</div>`;
  // most useful first: scores, time at aiming height, aim movement, by arrow in the end, follow-through, push, cant
  h += hScore + hAim + hMove + hPos + hFt + hPush + hCant;
  if (del.length) h += `<div class="msg">${t('nFalse', { n: del.length })}</div>`;
  // table
  const cols = ['#', t('thTime'), t('thEnd'), t('thArrow'), t('thRaise'), t('thDraw'), t('thHold'), t('thAimT'), t('thStill'), t('thMove'), t('thAngle'), t('thCant'), t('thFtD'), t('thFtR'), t('thPushD'), t('thPushR'), t('thPeak'), t('thScore')];
  const v = (x, k, f = f1) => has(x, k) ? f(x.d[k]) : '';
  let tb = '<thead><tr>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>';
  for (const x of [...list, ...del].sort((a, b) => a.t - b.t)) {
    const d = x.flags & F_DEL, sc = !d && x.pos === 1 && x.end.score ? x.end.score.v.map(valText).join(' ') + ' = ' + x.end.score.sum : '';
    tb += `<tr${d ? ' class="del"' : ''}><td>${x.i}</td><td>${fTimeS(x.t)}</td><td>${d ? '' : x.end.n}</td><td>${d ? '' : x.pos}</td><td>${v(x, 'raise')}</td><td>${v(x, 'draw')}</td><td>${v(x, 'hold')}</td>` +
          `<td>${num(aimT(x)) ? f1(aimT(x)) : ''}</td><td>${f1(x.aim)}</td><td>${v(x, 'move', f2)}</td><td>${v(x, 'pitch')}</td><td>${v(x, 'cant')}</td><td>${v(x, 'drop', f0)}</td><td>${v(x, 'side', f0)}</td>` +
          `<td>${v(x, 'pushDown', f0)}</td><td>${v(x, 'pushRight', f0)}</td><td>${f1(x.peak)}</td><td>${sc}</td></tr>`;
  }
  h += `<details><summary>${t('tblArrows')}</summary><div class="tbl"><table>${tb}</tbody></table></div></details>`;
  return h;
}

// a period: one point per day (week, month) or per week (all time)
function renderPeriod(kind, key) {
  const unit = kind === 'all' ? 'week' : 'day';
  const fromTs = fromDate().getTime() / 1000, inP = ts => ts >= fromTs && (kind === 'all' || keyOf[kind](ts) === key);
  const ends = A.ends.filter(e => inP(e.start)), list = ends.flatMap(e => e.list), del = A.deleted.filter(x => inP(x.t));
  const bk = ts => keyOf[unit](ts);
  const keys = [...new Set([...list.map(x => bk(x.t)), ...del.map(x => bk(x.t))])].sort();
  const B = keys.map(k => {
    const E = ends.filter(e => bk(e.start) === k), L = E.flatMap(e => e.list), D = L.filter(x => x.d), sc = E.filter(e => e.score);
    const aim = D.map(aimT).filter(num), still = L.map(x => x.aim).filter(num), dr = D.filter(x => has(x, 'drop')).map(x => x.d.drop), sd = D.filter(x => has(x, 'side')).map(x => x.d.side);
    const nSc = sc.reduce((s, e) => s + e.score.v.length, 0);
    return { k, date: dateOfKey(k), E, L, D, n: L.length, del: del.filter(x => bk(x.t) === k).length, aim: mean(aim), aimSd: sdev(aim),
             move: mean(D.filter(x => has(x, 'move')).map(x => x.d.move)), cantSd: cantSpread(E), drop: mean(dr), dropSd: sdev(dr), side: mean(sd), sideSd: sdev(sd),
             still: mean(still), stillSd: sdev(still), pts: sc.reduce((s, e) => s + e.score.sum, 0), nSc, nE: sc.length, perArrow: nSc ? sc.reduce((s, e) => s + e.score.sum, 0) / nSc : null };
  });
  const lab = b => unit === 'week' ? fDateS(b.date) : (kind === 'week' ? fDay(b.date) : fDateS(b.date));
  const cats = B.map(lab), uName = t(unit === 'week' ? 'unitWeek' : 'unitDay');
  const scored = ends.filter(e => e.score), nSc = scored.reduce((s, e) => s + e.score.v.length, 0), pts = scored.reduce((s, e) => s + e.score.sum, 0);
  const withD = list.filter(x => x.d);
  if (kind === 'week') $('title').textContent = t('titleWeek', { date: fTitle(dateOfKey(key)).replace(/^[^ ]+ /, '') });
  else if (kind === 'month') { const s = dateOfKey(key).toLocaleDateString(LOC, { month: 'long', year: 'numeric' }); $('title').textContent = t('titleMonth', { month: s.charAt(0).toUpperCase() + s.slice(1) }); }
  else $('title').textContent = t('titleAll', { date: fTitle(fromDate()).replace(/^[^ ]+ /, '') });
  const nDays = new Set(list.map(x => keyOf.day(x.t))).size;
  $('lede').innerHTML = (list.length ? t('ledePeriod', { arrows: t('arrows', { n: list.length }), days: t('days', { n: nDays }), ends: t('ends', { n: ends.length }) }) + ' ' : '') + srcText() + ' ' + t('hoverTip');
  const aimAll = withD.map(aimT).filter(num);
  stats([[list.length, t('stArrows')], [nDays, t('stDays')], [ends.length, t('stEnds')], nSc ? [pts, t('stPoints')] : null, nSc ? [f2(pts / nSc), t('stPerArrow')] : null,
         aimAll.length ? [f1(median(aimAll)) + ' s', t('stAimT')] : null, withD.some(x => has(x, 'move')) ? [fMove(median(withD.filter(x => has(x, 'move')).map(x => x.d.move))), t('stMove')] : null,
         del.length ? [del.length, t('stFalse')] : null]);
  const per = t(unit === 'week' ? 'perWeek' : 'perDay');
  const trend = (key, fmt) => {
    const s = B.filter(b => num(b[key]));
    if (!s.length) return [];
    if (s.length === 1) return [t('nTrendOne', { unit: uName, a: fmt(s[0][key]) })];
    return [t('nTrend', { a: fmt(s[0][key]), first: lab(s[0]), b: fmt(s[s.length - 1][key]), last: lab(s[s.length - 1]) })];
  };
  let h = `<h2>${t(unit === 'week' ? 'hPeriodWeek' : 'hPeriodDay')}</h2>`;
  // arrows and false counts
  const most = B.reduce((a, b) => (!a || b.n > a.n ? b : a), null);
  const notesA = [t('nArrowsP', { arrows: t('arrows', { n: list.length }), date: most ? lab(most) : '', m: most ? most.n : 0 }), del.length ? t('nFalse', { n: del.length }) : t('nNoFalse')];
  const hArrows = panel(t('pArrows'), `${t('pArrowsSub')} · ${per}`, 'p-arrows', W => catChart({ cats, label: t('pArrows'),
    series: [{ kind: 'bar', stack: true, color: 'var(--s1)', values: B.map(b => b.n), tips: B.map(b => `${lab(b)} · ${t('arrows', { n: b.n })}${b.del ? ' · ' + b.del + ' ' + t('tipFalse') : ''}`) },
             { kind: 'bar', stack: true, color: 'var(--s2)', values: B.map(b => b.del), tips: B.map(b => `${lab(b)} · ${b.del} ${t('tipFalse')}`) }] }, W), notesA,
    del.length ? legend([['var(--s1)', t('lArrows')], ['var(--s2)', t('lFalse')]]) : '');
  const sdChart = (id, title, sub, key, keySd, fmt, unit) => {
    if (!B.some(b => num(b[key]))) return '';
    return panel(title, `${sub} · ${per}`, id, W => catChart({ cats, yu: unit, label: title, series: [{ kind: 'dot', color: 'var(--s1)', values: B.map(b => b[key]), sd: keySd ? B.map(b => b[keySd]) : null,
      tips: B.map(b => `${lab(b)} · ${fmt(b[key])}${keySd && num(b[keySd]) ? ' ± ' + fmt(b[keySd]) : ''} · ${t('arrows', { n: b.n })}`) }] }, W), trend(key, fmt));
  };
  let hCant = '', hFtP = '', hScore = '';
  const hAim = sdChart('p-aim', t('pAim'), t('pAimSub'), 'aim', 'aimSd', v => f1(v) + ' s', ' s');
  const hMove = sdChart('p-move', t('pMove'), t('pMoveSub', { cm: f1(cm(1)), dist: DB.settings.dist }), 'move', null, fMove, '°');
  if (B.some(b => num(b.cantSd))) {
    const dr = cantDrift(ends), extra = dr ? [t('nCantDriftP', dr)] : [];
    const c = sdChart('p-cant', t('pCant'), t('pCantSub'), 'cantSd', null, v => '±' + f1(v) + '°', '°');
    hCant = c.replace('<div class="note">', `<div class="note">${extra.map(n => `<p>${n}</p>`).join('')}`);
  }
  if (B.some(b => num(b.drop))) {
    const fd = v => f1(v) + '°';
    hFtP = panel(t('pFt'), `${t('pFtSub')} · ${per}`, 'p-ft', W => catChart({ cats, yu: '°', label: t('pFt'), zero: true,
      series: [{ kind: 'dot', color: 'var(--s1)', values: B.map(b => num(b.drop) ? -b.drop : null), sd: B.map(b => b.dropSd), tips: B.map(b => `${lab(b)} · ${t('lBack')} ${fd(-b.drop)} ± ${fd(b.dropSd)}`) },
                 { kind: 'dot', color: 'var(--s2)', values: B.map(b => num(b.side) ? -b.side : null), sd: B.map(b => b.sideSd), tips: B.map(b => `${lab(b)} · ${t('lLeft')} ${fd(-b.side)} ± ${fd(b.sideSd)}`) }] }, W),
      [t('lBack') + ': ' + trend('drop', v => fd(-v)).join(''), t('lLeft') + ': ' + trend('side', v => fd(-v)).join('')], legend([['var(--s1)', t('lBack')], ['var(--s2)', t('lLeft')]]));
  }
  const hStill = sdChart('p-still', t('pStill'), t('pStillSub'), 'still', 'stillSd', v => f1(v) + ' s', ' s');
  if (scored.length) {
    const best = B.filter(b => num(b.perArrow)).reduce((a, b) => (!a || b.perArrow > a.perArrow ? b : a), null);
    const c = sdChart('p-score', t('pScore'), t('pScoreSub'), 'perArrow', null, f2, '');
    hScore = c.replace(/<div class="note">.*<\/div><\/section>$/, `<div class="note"><p>${t('nScoreP', { v: f2(pts / nSc), n: scored.length, unit: uName, best: f2(best.perArrow), date: lab(best) })}</p>${trend('perArrow', f2).map(n => `<p>${n}</p>`).join('')}</div></section>`);
  } else hScore = `<div class="msg">${t('nNoScoreP')}</div>`;
  // most useful first
  h += hScore + hArrows + hAim + hMove + hStill + posPair(withD, t('cPosSubP')) + hFtP + ftPanel(withD, 'p-ft2') + pushPanel(withD, 'p-push') + hCant;
  // table
  const cols = [t('thDate'), t('thArrows'), t('thFalse'), t('thEnds'), t('thAimT'), t('thMove'), t('pCant') + ' °', t('thFtD'), t('thFtR'), t('thStill'), t('thScore'), t('thPerArrow')];
  let tb = '<thead><tr>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>';
  for (const b of B) tb += `<tr><td>${lab(b)}</td><td>${b.n}</td><td>${b.del || ''}</td><td>${b.E.length}</td><td>${f1(b.aim)}</td><td>${f2(b.move)}</td><td>${f1(b.cantSd)}</td><td>${f1(b.drop)}</td><td>${f1(b.side)}</td><td>${f1(b.still)}</td><td>${b.nSc ? b.pts : ''}</td><td>${b.nSc ? f2(b.perArrow) : ''}</td></tr>`;
  h += `<details><summary>${t(unit === 'week' ? 'tblWeeks' : 'tblDays')}</summary><div class="tbl"><table>${tb}</tbody></table></div></details>`;
  return h;
}

function srcText() {
  if (SRC.kind === 'saved') return t('srcSaved', { date: fDate(new Date(SRC.at)) });
  if (SRC.kind === 'file') return t('srcFile', { name: esc(SRC.name) });
  if (SRC.kind === 'demo') return t('srcDemo');
  return t('srcLocal');
}
function stats(items) { $('stats').innerHTML = items.filter(Boolean).map(([b, l]) => `<div class="stat"><b>${esc(b)}</b><span>${esc(l)}</span></div>`).join(''); }
// "From": the first day with shot details unless set; everything before it is left out
function firstDetailDay() { const x = A.live.find(y => y.d); return x ? keyOf.day(x.t) : (A.live.length ? keyOf.day(A.live[0].t) : dayKey(new Date())); }
function fromDate() { return dateOfKey(st.from || firstDetailDay()); }
function periodKeys() {
  const f = fromDate().getTime() / 1000;
  const ts = [...A.live, ...A.deleted].filter(x => x.t >= f).map(x => x.t);
  if (st.tab === 'all') return ts.length ? ['all'] : [];
  return [...new Set(ts.map(keyOf[st.tab]))].sort();
}

function render() {
  LANG = pickLang(); LOC = LOCALES[LANG]; document.documentElement.lang = LANG;
  $('back').textContent = t('backLink'); $('back').hidden = SRC.kind === 'saved';
  [...$('tabs').children].forEach(b => { b.textContent = t('tab' + b.dataset.v.charAt(0).toUpperCase() + b.dataset.v.slice(1)); b.classList.toggle('on', b.dataset.v === st.tab); });
  $('from-l').textContent = t('from'); $('open').textContent = t('open'); $('save').textContent = t('save');
  $('foot').textContent = t('foot', { date: fDate(SRC.kind === 'saved' ? new Date(SRC.at) : new Date()) });
  charts = [];
  if (!A || !(A.live.length + A.deleted.length)) {
    $('title').textContent = 'PfeilZaehler3000'; $('lede').textContent = ''; $('stats').innerHTML = '';
    $('out').innerHTML = `<div class="msg">${t('noData')}</div>`; $('tabs').hidden = true; $('nav').parentNode.hidden = true; $('save').hidden = true;
    return;
  }
  $('tabs').hidden = false; $('nav').parentNode.hidden = false; $('save').hidden = false;
  $('from').value = dayKey(fromDate());
  const keys = periodKeys();
  if (!keys.includes(st.key)) st.key = keys[keys.length - 1] || null;
  const i = keys.indexOf(st.key);
  $('prev').disabled = i <= 0; $('next').disabled = i < 0 || i >= keys.length - 1; $('nav').querySelector('span').hidden = false;
  $('prev').hidden = $('next').hidden = st.tab === 'all';
  $('plabel').textContent = !st.key ? '' : st.tab === 'day' ? fDay(dateOfKey(st.key)) : st.tab === 'week' ? fDateS(dateOfKey(st.key)) + ' – ' + fDateS(new Date(dateOfKey(st.key).getTime() + 6 * DAY * 1000))
    : st.tab === 'month' ? dateOfKey(st.key).toLocaleDateString(LOC, { month: 'short', year: 'numeric' }) : '';
  if (!st.key) {
    $('title').textContent = 'PfeilZaehler3000'; $('lede').textContent = srcText(); $('stats').innerHTML = '';
    $('out').innerHTML = `<div class="msg">${t('noPeriod')}</div>`;
    return;
  }
  $('out').innerHTML = st.tab === 'day' ? renderDay(st.key) : renderPeriod(st.tab, st.key);
  draw();
}
function draw() {
  for (const [id, fn] of charts) { const el = $(id); if (el) el.innerHTML = fn(Math.max(260, Math.round(el.clientWidth))).replace(/ width="\d+" height="\d+"/, ''); }
}
let rt = null, lastW = innerWidth;
addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(draw, 150); });

$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.tab = b.dataset.v; st.key = null; render(); };
$('prev').onclick = () => { const k = periodKeys(), i = k.indexOf(st.key); if (i > 0) { st.key = k[i - 1]; render(); scrollTo(0, 0); } };
$('next').onclick = () => { const k = periodKeys(), i = k.indexOf(st.key); if (i >= 0 && i < k.length - 1) { st.key = k[i + 1]; render(); scrollTo(0, 0); } };
$('from').onchange = e => { st.from = e.target.value || null; if (SRC.kind !== 'saved') store.set(R_FROM, st.from); render(); };
$('lang').onchange = e => { store.set(R_LANG, e.target.value || null); render(); };
$('open').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { DB = normalize(JSON.parse(await f.text())); A = analyse(DB); SRC = { kind: 'file', name: f.name }; st.key = null; render(); }
  catch (err) { $('out').insertAdjacentHTML('afterbegin', `<div class="msg">${esc(t('badFile') + err.message)}</div>`); }
  e.target.value = '';
};

// Save report: this page with the arrows from "From" on built in, opens anywhere without the phone page
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function exportText(name, text, type) {
  try {
    const file = new File([text], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return true;
}
function reportHtml() {
  const f = fromDate().getTime() / 1000;
  const data = { shots: DB.shots.filter(x => x.t >= f).map(x => { const y = { i: x.i, t: x.t, peak: x.peak, aim: x.aim, flags: x.flags }; if (x.d) y.d = x.d; return y; }),
                 scores: Object.fromEntries(Object.entries(DB.scores).filter(([k]) => +k >= f - 5)), endMarks: DB.endMarks.filter(m => m >= f), settings: DB.settings, hist: DB.hist };
  const json = JSON.stringify({ db: data, saved: SRC.kind === 'saved' ? SRC.at : Date.now(), lang: LANG, state: { tab: st.tab, key: st.key, from: st.from || firstDetailDay() } }).replace(/</g, '\\u003c');
  const src = (window.__pzReport ? PRISTINE.replace(/<script id="pz-report">[\s\S]*?<\/script>\n?/, '') : PRISTINE).replace(/ class="on"/, '');
  return src.replace('<script>', `<script id="pz-report">window.__pzReport = ${json};<\/script>\n<script>`);
}
$('save').onclick = async () => {
  const name = `PfeilZaehler3000-report-${st.key && st.key !== 'all' ? st.key : dayKey(new Date())}.html`;
  if (await exportText(name, reportHtml(), 'text/html')) $('foot').textContent = t('saved') + ' ' + $('foot').textContent;
};

// tooltips: hover, or tap on a phone
{
  const tip = $('tip');
  const show = (e, el) => { tip.textContent = el.dataset.tip; if (!tip.textContent) return; tip.style.opacity = 1;
    const x = Math.max(8, Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)), y = e.clientY - tip.offsetHeight - 12;
    tip.style.left = x + 'px'; tip.style.top = (y < 8 ? e.clientY + 18 : y) + 'px'; };
  document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(e, el); else if (e.pointerType === 'mouse') tip.style.opacity = 0; });
  document.addEventListener('pointerdown', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(e, el); else tip.style.opacity = 0; });
  addEventListener('scroll', () => { tip.style.opacity = 0; }, { passive: true });
}
render();
</script>
